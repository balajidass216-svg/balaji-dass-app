
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Admin Deposit Requests</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f2f2f2;
}

.header{
    background:#111827;
    color:white;
    padding:18px;
    text-align:center;
    font-size:21px;
    font-weight:bold;
}

.container{
    max-width:600px;
    margin:20px auto;
    padding:10px;
}

.deposit-card{
    background:white;
    border-radius:14px;
    padding:18px;
    margin-bottom:15px;
    box-shadow:0 3px 12px rgba(0,0,0,0.10);
}

.row{
    display:flex;
    justify-content:space-between;
    gap:10px;
    padding:7px 0;
    border-bottom:1px solid #eee;
}

.row:last-child{
    border-bottom:0;
}

.label{
    font-weight:bold;
    color:#555;
}

.amount{
    font-size:22px;
    font-weight:bold;
}

.status{
    display:inline-block;
    margin-top:10px;
    padding:7px 12px;
    border-radius:20px;
    background:#fff3cd;
    color:#856404;
    font-weight:bold;
}

.actions{
    display:flex;
    gap:10px;
    margin-top:15px;
}

.actions button{
    flex:1;
    padding:12px;
    border:0;
    border-radius:9px;
    color:white;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

.accept{
    background:#16a34a;
}

.cancel{
    background:#dc2626;
}

#message{
    text-align:center;
    padding:20px;
    color:#666;
}

.refresh{
    width:100%;
    padding:13px;
    margin-bottom:15px;
    border:0;
    border-radius:10px;
    background:#2563eb;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

</style>

</head>

<body>

<div class="header">
    ADMIN DEPOSIT REQUESTS
</div>

<div class="container">

    <button class="refresh" onclick="loadDeposits()">
        🔄 Refresh Requests
    </button>

    <div id="message">
        Loading...
    </div>

    <div id="depositList"></div>

</div>


<script>


// ===============================
// SUPABASE
// ===============================

const SUPABASE_URL =
"https://glhomrlwnwhevunfubog.supabase.co";

const SUPABASE_KEY =
"sb_publishable_VihOz3hSXZzUiI9eANDL0A_EtaD-KIB";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);



// ===============================
// LOAD DEPOSIT REQUESTS
// ===============================

async function loadDeposits(){

    const list =
        document.getElementById("depositList");

    const message =
        document.getElementById("message");


    list.innerHTML = "";

    message.innerText =
        "Loading...";


    const { data, error } =
        await supabaseClient

        .from("deposit_requests")

        .select("*")

        .eq("status", "pending")

        .order("created_at", {
            ascending:false
        });


    if(error){

        console.error(error);

        message.innerText =
            "Error: " + error.message;

        return;
    }


    if(!data || data.length === 0){

        message.innerText =
            "Koi pending deposit request nahi hai.";

        return;
    }


    message.innerText =
        data.length + " Pending Request";


    data.forEach(item => {


        const card =
            document.createElement("div");


        card.className =
            "deposit-card";


        const date =
            item.created_at
            ? new Date(item.created_at)
                .toLocaleString("en-IN")
            : "-";


        card.innerHTML = `

            <div class="row">

                <span class="label">
                    Deposit ID
                </span>

                <span>
                    ${item.id}
                </span>

            </div>


            <div class="row">

                <span class="label">
                    User ID
                </span>

                <span>
                    ${item.user_id}
                </span>

            </div>


            <div class="row">

                <span class="label">
                    Amount
                </span>

                <span class="amount">
                    ₹${Number(item.amount).toFixed(2)}
                </span>

            </div>


            <div class="row">

                <span class="label">
                    Time
                </span>

                <span>
                    ${date}
                </span>

            </div>


            <span class="status">
                PENDING
            </span>


            <div class="actions">

                <button
                    class="accept"
                    onclick='acceptDeposit(
                        ${item.id},
                        "${item.user_id}",
                        ${Number(item.amount)}
                    )'>

                    ✅ ACCEPT

                </button>


                <button
                    class="cancel"
                    onclick="cancelDeposit(${item.id})">

                    ❌ CANCEL

                </button>

            </div>

        `;


        list.appendChild(card);

    });

}



// ===============================
// ACCEPT DEPOSIT
// ===============================

async function acceptDeposit(
    depositId,
    userId,
    amount
){

    const confirmAccept =
        confirm(
            "₹" +
            Number(amount).toFixed(2) +
            " wallet me add karna hai?"
        );


    if(!confirmAccept){

        return;

    }


    // Pehle request ka current status check

    const { data: request, error: requestError } =

        await supabaseClient

        .from("deposit_requests")

        .select("status")

        .eq("id", depositId)

        .single();


    if(requestError){

        alert(
            "Request check nahi ho payi."
        );

        console.error(requestError);

        return;
    }


    // Agar already approved hai

    if(request.status === "approved"){

        alert(
            "Ye deposit already approved hai."
        );

        loadDeposits();

        return;
    }


    // Agar already cancelled hai

    if(request.status === "cancelled"){

        alert(
            "Ye deposit already cancelled hai."
        );

        loadDeposits();

        return;
    }



    // ===============================
    // USER CURRENT BALANCE
    // ===============================

    const { data: user, error: userError } =

        await supabaseClient

        .from("login")

        .select("balance")

        .eq("id", userId)

        .single();


    if(userError){

        alert(
            "User ka wallet nahi mila."
        );

        console.error(userError);

        return;
    }


    const currentBalance =
        Number(user.balance) || 0;


    const depositAmount =
        Number(amount) || 0;


    const newBalance =
        currentBalance + depositAmount;



    // ===============================
    // ADD BALANCE
    // ===============================

    const { error: balanceError } =

        await supabaseClient

        .from("login")

        .update({
            balance: newBalance
        })

        .eq("id", userId);


    if(balanceError){

        alert(
            "Wallet balance update nahi hua."
        );

        console.error(balanceError);

        return;
    }



    // ===============================
    // CHANGE REQUEST STATUS
    // ===============================

    const { error: statusError } =

        await supabaseClient

        .from("deposit_requests")

        .update({
            status: "approved"
        })

        .eq("id", depositId);


    if(statusError){

        alert(
            "Deposit status update nahi hua."
        );

        console.error(statusError);

        return;
    }



    alert(
        "Deposit Approved ✅\n\n" +
        "₹" +
        depositAmount.toFixed(2) +
        " wallet me add ho gaya."
    );


    // List refresh

    loadDeposits();

}



// ===============================
// CANCEL DEPOSIT
// ===============================

async function cancelDeposit(depositId){

    const confirmCancel =
        confirm(
            "Is deposit request ko cancel karna hai?"
        );


    if(!confirmCancel){

        return;

    }


    // Current status check

    const { data: request, error: requestError } =

        await supabaseClient

        .from("deposit_requests")

        .select("status")

        .eq("id", depositId)

        .single();


    if(requestError){

        alert(
            "Request check nahi ho payi."
        );

        console.error(requestError);

        return;
    }


    if(request.status === "approved"){

        alert(
            "Ye deposit already approved hai."
        );

        loadDeposits();

        return;
    }


    if(request.status === "cancelled"){

        alert(
            "Ye deposit already cancelled hai."
        );

        loadDeposits();

        return;
    }



    // Sirf status cancelled hoga
    // Wallet me kuch add nahi hoga

    const { error } =

        await supabaseClient

        .from("deposit_requests")

        .update({
            status: "cancelled"
        })

        .eq("id", depositId);


    if(error){

        alert(
            "Deposit cancel nahi hua."
        );

        console.error(error);

        return;
    }


    alert(
        "Deposit Cancelled ❌"
    );


    loadDeposits();

}



// ===============================
// PAGE OPEN HOTE HI LOAD
// ===============================

loadDeposits();

</script>

</body>
</html>
```
