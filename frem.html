<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Winning</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
}

body{
  font-family:Arial,sans-serif;
  background:#f2f2f2;
  overflow:hidden;
}


/* =========================
   HEADER
========================= */

.title{
  height:28px;

  display:grid;
  grid-template-columns:1fr 1fr 1fr;

  align-items:center;

  background:green;
  color:white;

  padding:0 10px;

  font-size:12px;
  font-weight:bold;
}

.title div:nth-child(2){
  text-align:center;
}

.title div:nth-child(3){
  text-align:right;
}


/* =========================
   LIST AREA
========================= */

#list{
  position:relative;

  width:100%;
  height:calc(100% - 28px);

  overflow:hidden;
}


/* =========================
   SCROLL LIST
========================= */

#scrollList{
  position:absolute;

  left:0;
  top:0;

  width:100%;

  padding:5px 8px;

  transform:translateY(0);
}


/* =========================
   CARD
========================= */

.card{

  width:100%;

  background:white;

  margin-bottom:6px;

  padding:7px 10px;

  border-radius:9px;

  display:grid;

  grid-template-columns:1fr 1fr 1fr;

  align-items:center;

  box-shadow:0 1px 4px rgba(0,0,0,.12);

}


/* =========================
   USER
========================= */

.userBox{
  min-width:0;
}

.name{

  font-size:14px;

  font-weight:bold;

  color:#222;

  overflow:hidden;

  white-space:nowrap;

  text-overflow:ellipsis;

}


/* =========================
   MOBILE
   ONLY LAST 4 DIGITS
========================= */

.mobile{

  font-size:11px;

  color:#777;

  margin-top:2px;

  font-weight:normal;

}


/* =========================
   MARKET
========================= */

.market{

  text-align:center;

  font-size:13px;

  font-weight:bold;

  color:#1e73be;

  overflow:hidden;

  white-space:nowrap;

  text-overflow:ellipsis;

}


/* =========================
   AMOUNT
========================= */

.amount{

  text-align:right;

  font-size:14px;

  font-weight:bold;

  color:green;

}


/* =========================
   LOADING
========================= */

.loading{

  text-align:center;

  padding:15px;

  font-weight:bold;

  color:#555;

}

</style>

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<div class="title">

  <div>User</div>

  <div>Market</div>

  <div>Winning</div>

</div>


<!-- =========================
     LIST
========================= -->

<div id="list">

  <div id="scrollList">

    <div class="loading">
      Loading...
    </div>

  </div>

</div>



<script>


/* =========================
   SUPABASE
========================= */

const client = window.supabase.createClient(

  "https://glhomrlwnwhevunfubog.supabase.co",

  "sb_publishable_VihOz3hSXZzUiI9eANDL0A_EtaD-KIB"

);


/* =========================
   VARIABLES
========================= */

let position = 0;


/* =========================
   MASK MOBILE
   ONLY LAST 4 DIGITS
========================= */

function maskMobile(mobile){

  if(
    mobile === null ||
    mobile === undefined ||
    mobile === ""
  ){

    return "****";

  }


  const value =
    String(mobile).trim();


  if(value.length <= 4){

    return value;

  }


  return "****" +
         value.slice(-4);

}



/* =========================
   LOAD WINNING
========================= */

async function loadWinning(){

  const scrollList =
    document.getElementById(
      "scrollList"
    );


  /* =========================
     GET WINNING DATA
  ========================= */

  const {
    data: winnings,
    error: winningError
  } = await client

    .from("admin wining")

    .select(
      "user_id, market, amount, created_at"
    )

    .order(
      "created_at",
      {
        ascending:false
      }
    );


  /* =========================
     WINNING ERROR
  ========================= */

  if(winningError){

    console.error(
      "WINNING ERROR:",
      winningError
    );

    scrollList.innerHTML = `

      <div class="loading">

        Winning load nahi hui

      </div>

    `;

    return;

  }


  /* =========================
     NO WINNING DATA
  ========================= */

  if(
    !winnings ||
    winnings.length === 0
  ){

    scrollList.innerHTML = `

      <div class="loading">

        No Winning Found

      </div>

    `;

    return;

  }



  /* =========================
     GET USERS
     MOBILE = login.mobile
  ========================= */

  const {
    data: users,
    error: userError
  } = await client

    .from("login")

    .select(
      "id, name, mobile"
    );


  /* =========================
     USER ERROR
  ========================= */

  if(userError){

    console.error(
      "USER ERROR:",
      userError
    );

    scrollList.innerHTML = `

      <div class="loading">

        User data load nahi hua

      </div>

    `;

    return;

  }



  /* =========================
     USER MAP
  ========================= */

  const userMap = {};


  if(users){

    users.forEach(user => {

      userMap[
        String(user.id)
      ] = {

        name:
          user.name ||
          "User",

        mobile:
          user.mobile ||
          ""

      };

    });

  }



  /* =========================
     CREATE LIST
  ========================= */

  let html = "";


  winnings.forEach(item => {


    /* =========================
       FIND USER
    ========================= */

    const user =
      userMap[
        String(item.user_id)
      ] || {

        name:"User",

        mobile:""

      };


    /* =========================
       USER NAME
    ========================= */

    const userName =
      user.name;


    /* =========================
       MOBILE LAST 4
    ========================= */

    const mobile =
      maskMobile(
        user.mobile
      );


    /* =========================
       MARKET
    ========================= */

    const market =
      item.market || "-";


    /* =========================
       WINNING AMOUNT
    ========================= */

    const amount =
      Number(
        item.amount || 0
      );



    /* =========================
       CARD
    ========================= */

    html += `

      <div class="card">


        <!-- USER -->

        <div class="userBox">

          <div class="name">

            ${userName}

          </div>


          <div class="mobile">

            ${mobile}

          </div>

        </div>



        <!-- MARKET -->

        <div class="market">

          ${market}

        </div>



        <!-- WINNING -->

        <div class="amount">

          ₹ ${amount}

        </div>


      </div>

    `;

  });



  /* =========================
     DUPLICATE FOR SCROLL
  ========================= */

  scrollList.innerHTML =
    html + html;


  /* =========================
     RESET POSITION
  ========================= */

  position = 0;

  scrollList.style.transform =
    "translateY(0px)";

}



/* =========================
   AUTO SCROLL
========================= */

function autoSlide(){

  const list =
    document.getElementById(
      "list"
    );


  const scrollList =
    document.getElementById(
      "scrollList"
    );


  if(
    !list ||
    !scrollList
  ){

    return;

  }


  /* =========================
     CONTENT SMALL
  ========================= */

  if(
    scrollList.scrollHeight <=
    list.clientHeight
  ){

    return;

  }


  /* =========================
     SCROLL SPEED
  ========================= */

  position -= 0.5;


  /* =========================
     HALF CONTENT
  ========================= */

  const halfHeight =
    scrollList.scrollHeight / 2;


  /* =========================
     RESET
  ========================= */

  if(
    Math.abs(position) >=
    halfHeight
  ){

    position = 0;

  }


  scrollList.style.transform =
    `translateY(${position}px)`;

}



/* =========================
   FIRST LOAD
========================= */

loadWinning();



/* =========================
   SMOOTH SCROLL
========================= */

setInterval(
  autoSlide,
  30
);



/* =========================
   REFRESH DATA
   EVERY 30 SECONDS
========================= */

setInterval(
  loadWinning,
  30000
);


</script>


</body>
</html>
