<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>All Games</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

body{
  font-family:Arial;
  margin:0;
  background:#e5e7eb;
  padding-bottom:80px;
}

#menuBtn{
  position:fixed;
  left:12px;
  top:15px;
  font-size:28px;
  font-weight:bold;
  z-index:9999;
  cursor:pointer;
  background:#fff;
  width:38px;
  height:38px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 2px 8px rgba(0,0,0,.2);
}

.header{
  position:fixed;
  top:10px;
  left:10px;
  right:10px;
  background:#fff;
  padding:10px;
  border-radius:20px;
  display:flex;
  justify-content:space-between;
  z-index:999;
}

#userId{
  position:relative;
  left:35px;
  background:green;
  color:#fff;
  padding:6px 12px;
  border-radius:20px;
  font-size:12px;
}

#wallet{
  background:red;
  color:#fff;
  padding:6px 12px;
  border-radius:20px;
  font-size:12px;
}

.topBtns{
  margin-top:80px;
  display:flex;
  justify-content:space-around;
}

.topBtn{
  width:18%;
  padding:10px;
  border-radius:20px;
  color:#fff;
  text-align:center;
  cursor:pointer;
  font-size:12px;
}

.btn1{background:#6c5ce7;}
.btn2{background:#00b894;}
.btn3{background:#0984e3;}
.btn4{background:#e17055;}
.btn5{background:#111;}

.game{
  display:none;
}

.active{
  display:block;
}

.container{
  margin:10px;
  background:#fff;
  padding:15px;
  border-radius:15px;
  padding-bottom:150px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
}

.box{
  background:#fff;
  padding:10px;
  border-radius:10px;
  text-align:center;
  border:1px solid #ddd;
}

input{
  width:100%;
  padding:10px;
  border-radius:10px;
  border:1px solid #ccc;
  box-sizing:border-box;
}

button{
  margin-top:10px;
  padding:10px 20px;
  border:0;
  border-radius:8px;
  background:#111;
  color:#fff;
  cursor:pointer;
}

.bottom{
  position:fixed;
  bottom:0;
  width:100%;
  display:flex;
  z-index:1000;
}

.total{
  width:50%;
  background:linear-gradient(to right,blue,red);
  color:#fff;
  text-align:center;
  padding:15px;
}

.submit{
  width:50%;
  background:green;
  color:#fff;
  text-align:center;
  padding:15px;
  font-weight:bold;
  font-size:16px;
  cursor:pointer;
}

</style>

</head>

<body>

<div id="menuBtn" onclick="openMenu()">⋮</div>

<div class="header">

  <div id="userId">
    ID: 0
  </div>

  <div id="wallet">
    ₹ 0
  </div>

</div>

<div class="topBtns">

  <div class="topBtn btn1" onclick="showGame('jodi')">
    JODI
  </div>

  <div class="topBtn btn2" onclick="showGame('haruf')">
    HARUF
  </div>

  <div class="topBtn btn3" onclick="showGame('crossing')">
    CROSSING
  </div>

  <div class="topBtn btn4" onclick="showGame('copy')">
    COPY
  </div>

 

</div>


<!-- JODI -->

<div id="jodi" class="game active container">

  <div class="grid" id="jodiGrid"></div>

</div>


<!-- HARUF -->

<div id="haruf" class="game container">

  <h3>Single Andar</h3>

  <div class="grid" id="harufGrid1"></div>

  <h3>Single Bahar</h3>

  <div class="grid" id="harufGrid2"></div>

</div>


<!-- CROSSING -->

<div id="crossing" class="game container">

  <label>1ST NUMBER</label>

  <input
    id="num1"
    type="text"
    inputmode="numeric"
    oninput="onlyNumber(this)"
  >

  <label>2ND NUMBER</label>

  <input
    id="num2"
    type="text"
    inputmode="numeric"
    oninput="onlyNumber(this)"
  >

  <label>POINTS</label>

  <input
    id="points"
    type="text"
    inputmode="numeric"
    oninput="onlyNumber(this)"
  >

  <button onclick="generateCross()">
    SET
  </button>

  <div
    id="crossGrid"
    style="
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:10px;
      margin-top:10px;">
  </div>

</div>


<!-- COPY -->

<div id="copy" class="game container">

  <label>ENTER DIGIT</label>

  <input
    id="digits"
    type="text"
    inputmode="numeric"
    autocomplete="off"
    oninput="
      this.value=this.value.replace(/[^0-9]/g,'')
    "
  >

  <label>ENTER AMOUNT</label>

  <input
    id="amt"
    type="number"
    inputmode="numeric"
    min="0"
    step="1"
    placeholder="Enter amount"
  >

  <button onclick="generateCopy()">
    ADD
  </button>

  <table id="table" border="1" width="100%">

    <tr>
      <th>NUMBER</th>
      <th>AMOUNT</th>
      <th>DEL</th>
    </tr>

  </table>

</div>


<!-- BOTTOM -->

<div class="bottom">

  <div class="total" id="total">
    ₹ 0
  </div>

  <div class="submit" onclick="submitAll()">
    SUBMIT
  </div>

</div>


<script>

/* =========================
   ONLY NUMBER
========================= */

function onlyNumber(input){

  input.value =
    input.value.replace(/[^0-9]/g,'');

}


/* =========================
   SUPABASE
========================= */

const client = supabase.createClient(

  "https://glhomrlwnwhevunfubog.supabase.co",

  "sb_publishable_VihOz3hSXZzUiI9eANDL0A_EtaD-KIB"

);


/* =========================
   USER
========================= */

const user =
  JSON.parse(localStorage.getItem("user"));

if(!user){

  document.getElementById("userId")
    .innerText = "ID: 0";

}else{

  document.getElementById("userId")
    .innerText = "ID: " + user.id;

  loadUser();

}


/* =========================
   LOAD WALLET
========================= */

async function loadUser(){

  if(!user){
    return;
  }

  const {data,error} = await client

    .from("login")
    .select("balance")
    .eq("id",user.id)
    .single();

  if(error){

    console.error(error);

    document.getElementById("wallet")
      .innerText = "₹ 0";

    return;

  }

  if(data){

    document.getElementById("wallet")
      .innerText =
      "₹ " + (Number(data.balance) || 0);

  }

}


/* =========================
   MARKET
========================= */

const market =
  localStorage.getItem("market") || "UNKNOWN";


/* =========================
   GAME VARIABLES
========================= */

let dataArr = [];

let total = 0;

let isSubmitting = false;

let lastCrossInput = "";

let lastCopyInput = "";


/* =========================
   UPDATE TOTAL
========================= */

function updateTotal(){

  total = 0;

  dataArr.forEach(item => {

    total += Number(item.amount) || 0;

  });

  document.getElementById("total")
    .innerText = "₹ " + total;

}


/* =========================
   RESET
========================= */

function resetGameData(){

  dataArr = [];

  total = 0;

  lastCrossInput = "";

  lastCopyInput = "";

  document
    .querySelectorAll(".game input")
    .forEach(input => {

      input.value = "";

    });

  document.getElementById("crossGrid")
    .innerHTML = "";

  document.getElementById("table")
    .innerHTML = `
      <tr>
        <th>NUMBER</th>
        <th>AMOUNT</th>
        <th>DEL</th>
      </tr>
    `;

  updateTotal();

}


/* =========================
   SHOW GAME
========================= */

function showGame(id){

  resetGameData();

  document
    .querySelectorAll(".game")
    .forEach(game => {

      game.classList.remove("active");

    });

  const selectedGame =
    document.getElementById(id);

  if(selectedGame){

    selectedGame.classList.add("active");

  }

}


/* =========================
   JODI
========================= */

for(let i=0;i<100;i++){

  let num =
    i.toString().padStart(2,'0');

  document.getElementById("jodiGrid")
    .innerHTML += `

      <div class="box">

        ${num}

        <input
          type="text"
          inputmode="numeric"
          oninput="
            onlyNumber(this);
            add('${num}',this.value)
          "
        >

      </div>

    `;

}


/* =========================
   HARUF
========================= */

for(let i=0;i<10;i++){

  document.getElementById("harufGrid1")
    .innerHTML += `

      <div class="box">

        ${i}

        <input
          type="text"
          inputmode="numeric"
          oninput="
            onlyNumber(this);
            add('A${i}',this.value)
          "
        >

      </div>

    `;

  document.getElementById("harufGrid2")
    .innerHTML += `

      <div class="box">

        ${i}

        <input
          type="text"
          inputmode="numeric"
          oninput="
            onlyNumber(this);
            add('B${i}',this.value)
          "
        >

      </div>

    `;

}


/* =========================
   ADD
========================= */

function add(num,val){

  val = Number(val) || 0;

  dataArr =
    dataArr.filter(item =>
      item.number !== num
    );

  if(val > 0){

    dataArr.push({

      number:num,

      amount:val

    });

  }

  updateTotal();

}


/* =========================
   CROSSING
========================= */

function generateCross(){

  let n1 =
    document.getElementById("num1")
      .value.trim();

  let n2 =
    document.getElementById("num2")
      .value.trim();

  let a =
    Number(
      document.getElementById("points").value
    );

  if(!n1 || !n2 || a <= 0){

    alert("Number aur points enter karo");

    return;

  }

  let current =
    n1 + "|" + n2 + "|" + a;

  if(current === lastCrossInput){

    return;

  }

  lastCrossInput = current;

  document.getElementById("crossGrid")
    .innerHTML = "";

  dataArr = [];

  for(let i of n1){

    for(let j of n2){

      let pair = i + j;

      let exist =
        dataArr.find(item =>
          item.number === pair
        );

      if(exist){

        exist.amount += a;

      }else{

        dataArr.push({

          number:pair,

          amount:a

        });

      }

      document.getElementById("crossGrid")
        .innerHTML += `

          <div class="box">

            ${pair}

            <br>

            ₹${a}

          </div>

        `;

    }

  }

  updateTotal();

}


/* =========================
   COPY
========================= */

function generateCopy(){

  let d =
    document.getElementById("digits")
      .value.trim();

  let a =
    Number(
      document.getElementById("amt").value
    );

  if(!d || a <= 0){

    alert("Digit aur amount enter karo");

    return;

  }

  let current =
    d + "|" + a;

  if(current === lastCopyInput){

    return;

  }

  lastCopyInput = current;

  document.getElementById("table")
    .innerHTML = `

      <tr>
        <th>NUMBER</th>
        <th>AMOUNT</th>
        <th>DEL</th>
      </tr>

    `;

  dataArr = [];

  let arr =
    d.match(/.{1,2}/g);

  if(!arr){

    return;

  }

  arr.forEach(num => {

    if(num.length === 1){

      num = "0" + num;

    }

    let exist =
      dataArr.find(item =>
        item.number === num
      );

    if(exist){

      exist.amount += a;

    }else{

      dataArr.push({

        number:num,

        amount:a

      });

    }

    document.getElementById("table")
      .innerHTML += `

        <tr>

          <td>${num}</td>

          <td>${a}</td>

          <td>X</td>

        </tr>

      `;

  });

  updateTotal();

}


/* =========================
   SUBMIT
========================= */

async function submitAll(){

  if(isSubmitting){

    return;

  }

  if(!user){

    alert("Login again");

    return;

  }

  if(dataArr.length === 0 || total <= 0){

    alert("Kuch add karo pehle");

    return;

  }

  isSubmitting = true;

  const submitButton =
    document.querySelector(".submit");

  if(submitButton){

    submitButton.style.pointerEvents =
      "none";

    submitButton.innerText =
      "CHECKING...";

  }

  try{

    /* GET CURRENT BALANCE */

    const {data:userData,error:balanceError} =
      await client

        .from("login")

        .select("balance")

        .eq("id",user.id)

        .single();


    if(balanceError){

      throw balanceError;

    }


    const balance =
      Number(userData.balance) || 0;


    /* BALANCE CHECK */

    if(balance < total){

      alert(
        "Balance kam hai. Submit nahi hua."
      );

      return;

    }


    /* UPDATE BALANCE */

    if(submitButton){

      submitButton.innerText =
        "SAVING...";

    }

    const newBalance =
      balance - total;


    const {error:updateError} =
      await client

        .from("login")

        .update({
          balance:newBalance
        })

        .eq("id",user.id);


    if(updateError){

      throw updateError;

    }


    /* SAVE HISTORY ONLY AFTER
       BALANCE UPDATE */

    const {error:historyError} =
      await client

        .from("history")

        .insert({

          user_id:user.id,

          market:market,

         data:JSON.stringify(dataArr),

          total:total,

          created_at:
            new Date().toISOString()

        });


    if(historyError){

      throw historyError;

    }


    /* REFRESH WALLET */

    await loadUser();


    alert("GAME OK ✅");


    resetGameData();


  }catch(error){

    console.error(
      "SUBMIT ERROR:",
      error
    );

    alert(
      "Database error. Submit nahi hua."
    );

  }finally{

    isSubmitting = false;

    if(submitButton){

      submitButton.style.pointerEvents =
        "auto";

      submitButton.innerText =
        "SUBMIT";

    }

  }

}

</script>

<script src="menu.js"></script>
<script>

/* =========================
   GAME AUTO ON / OFF
========================= */


/* =========================
   MARKET CLOSE TIME
   SUPABASE SE
========================= */

let marketCloseTime = null;


/* =========================
   CLOSE DATE
   GAME DAY = 5:50 AM
========================= */

function getCloseDate(closeTime){

  if(!closeTime) return null;

  const [hour, minute] =
    closeTime.split(":").map(Number);

  const now = new Date();

  const close = new Date(now);

  close.setHours(hour, minute, 0, 0);


  const beforeGameDayStart =
    now.getHours() < 5 ||
    (
      now.getHours() === 5 &&
      now.getMinutes() < 50
    );


  if(beforeGameDayStart){

    if(
      hour > 5 ||
      (hour === 5 && minute >= 50)
    ){

      close.setDate(
        close.getDate() - 1
      );

    }

  }else{

    if(
      hour < 5 ||
      (hour === 5 && minute < 50)
    ){

      close.setDate(
        close.getDate() + 1
      );

    }

  }

  return close;

}


/* =========================
   GET MARKET CLOSE
   SUPABASE
========================= */

async function loadMarketClose(){

  if(!market || market === "UNKNOWN"){

    console.log("Market nahi mila");

    return;

  }


  const {data,error} = await client

    .from("Game result")

    .select("name, close")

    .eq("name", market)

    .limit(1);


  if(error){

    console.error(
      "CLOSE TIME ERROR:",
      error
    );

    return;

  }


  if(!data || data.length === 0){

    console.log(
      "Market nahi mila:",
      market
    );

    return;

  }


  marketCloseTime =
    data[0].close;


  console.log(
    "Market:",
    market,
    "Closing:",
    marketCloseTime
  );

}


/* =========================
   CHECK MARKET STATUS
========================= */

function checkMarketStatus(){

  if(!marketCloseTime){

    return;

  }


  const close =
    getCloseDate(marketCloseTime);


  if(!close){

    return;

  }


  const now =
    new Date();


  /* MARKET CLOSED */

  if(now >= close){

    /*
      Game ke saare inputs
      aur buttons band
    */

    document
      .querySelectorAll(
        ".game input, .game button"
      )
      .forEach(el => {

        el.disabled = true;

      });


    /*
      SUBMIT bhi band
    */

    const submit =
      document.querySelector(".submit");


    if(submit){

      submit.style.pointerEvents =
        "none";

      submit.innerText =
        "MARKET CLOSED";

    }


    /*
      User ko home page par bhejo
    */

    window.location.replace(
      "home.html"
    );

    return;

  }

}


/* =========================
   START
========================= */

loadMarketClose().then(() => {

  checkMarketStatus();

});


/* =========================
   HAR SECOND CHECK
========================= */

setInterval(() => {

  checkMarketStatus();

},1000);

</script>


</body>
</html>
</body>
</html>
