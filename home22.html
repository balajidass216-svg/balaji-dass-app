<script>

/* =====================================================

/* =====================================================
   TIME FORMAT
===================================================== */

function formatTimeAMPM(time){

  if(!time) return "--";


  /*
     Supabase time अगर
     14:50:00 या 14:50
     दोनों में आए तो काम करेगा।
  */

  const parts =
    String(time).split(":");


  let hour =
    Number(parts[0] || 0);


  const minute =
    Number(parts[1] || 0);


  const ampm =
    hour >= 12
      ? "PM"
      : "AM";


  hour =
    hour % 12 || 12;


  return (

    String(hour).padStart(2,"0")

    + ":" +

    String(minute).padStart(2,"0")

    + " " +

    ampm

  );

}


/* =====================================================
   GAME DAY
   -----------------------------------------------
   07:00 AM = NEW DAY
   06:59:59 AM = OLD DAY
===================================================== */

function getGameDay(){

  const now =
    new Date();


  /*
     रात 12 बजे से सुबह 6:59 तक
     previous game-day चलेगा।
  */

  if(
    now.getHours() < 7
  ){

    now.setDate(
      now.getDate() - 1
    );

  }


  const year =
    now.getFullYear();


  const month =
    String(
      now.getMonth() + 1
    ).padStart(2,"0");


  const day =
    String(
      now.getDate()
    ).padStart(2,"0");


  return (

    year +
    "-" +
    month +
    "-" +
    day

  );

}


/* =====================================================
   LOCAL STORAGE KEY
===================================================== */

function getLocalResultKey(
  marketName
){

  return (
    "kalResult_" +
    marketName
  );

}


/* =====================================================
   SAVE TODAY RESULT AS KAL
===================================================== */

function saveTodayAsKal(
  marketName,
  todayNumber
){

  if(!marketName) return;


  if(
    !todayNumber ||
    todayNumber === "**"
  ){

    return;

  }


  const key =
    getLocalResultKey(
      marketName
    );


  const gameDay =
    getGameDay();


  const savedData = {

    result:
      todayNumber,

    gameDay:
      gameDay

  };


  localStorage.setItem(

    key,

    JSON.stringify(
      savedData
    )

  );

}


/* =====================================================
   GET KAL RESULT
===================================================== */

function getKalResult(
  marketName
){

  if(!marketName){

    return "**";

  }


  const key =
    getLocalResultKey(
      marketName
    );


  const saved =
    localStorage.getItem(
      key
    );


  if(!saved){

    return "**";

  }


  try{

    const data =
      JSON.parse(
        saved
      );


    return (
      data.result ||
      "**"
    );

  }

  catch(error){

    return "**";

  }

}


/* =====================================================
   PREPARE TODAY / KAL
===================================================== */

function prepareLocalResults(
  games
){

  if(!games ||
     !games.length){

    return;

  }


  const currentGameDay =
    getGameDay();


  games.forEach(

    item => {

      if(!item.name){

        return;

      }


      const todayNumber =
        item.number;


      if(
        todayNumber &&
        todayNumber !== "**"
      ){

        const key =
          getLocalResultKey(
            item.name
          );


        const old =
          localStorage.getItem(
            key
          );


        if(old){

          try{

            const oldData =
              JSON.parse(old);


            if(
              oldData.gameDay !==
              currentGameDay
            ){

              saveTodayAsKal(

                item.name,

                item.number

              );

            }

          }

          catch(e){

            saveTodayAsKal(

              item.name,

              item.number

            );

          }

        }

        else{

          saveTodayAsKal(

            item.name,

            item.number

          );

        }

      }

    }

  );

}


/* =====================================================
   CLOSE DATE
   =====================================================

   IMPORTANT TIMING FIX

   00:00 - 06:59
   = next morning

   07:00 - 23:59
   = same game day

===================================================== */

function getCloseDate(
  closeTime
){

  if(!closeTime){

    return null;

  }


  /*
     Supabase में अगर
     14:50:00 आए या 14:50
     दोनों को handle करेंगे।
  */

  const parts =
    String(closeTime)
      .split(":");


  let hour =
    Number(parts[0] || 0);


  let minute =
    Number(parts[1] || 0);


  let second =
    Number(parts[2] || 0);


  /*
     Game-day हमेशा 7 AM से शुरू होगा।
  */

  const gameDay =
    getGameDay();


  const [
    year,
    month,
    day
  ] =
    gameDay
      .split("-")
      .map(Number);


  const close =
    new Date(

      year,

      month - 1,

      day,

      hour,

      minute,

      second,

      0

    );


  /*
     12 AM से 6:59 AM की timing
     अगले calendar date की morning होगी।
  */

  if(
    hour < 7
  ){

    close.setDate(
      close.getDate() + 1
    );

  }


  return close;

}


/* =====================================================
   REMAINING TIME
===================================================== */

function getRemainingTime(
  closeTime
){

  const close =
    getCloseDate(
      closeTime
    );


  if(!close){

    return {

      closed:true,

      text:"बंद",

      seconds:0

    };

  }


  const now =
    new Date();


  const diff =
    Math.floor(

      (
        close.getTime() -
        now.getTime()
      ) / 1000

    );


  /*
     जैसे ही close time cross होगा,
     तुरंत बंद।
  */

  if(diff <= 0){

    return {

      closed:true,

      text:"बंद",

      seconds:0

    };

  }


  let remaining =
    diff;


  const hours =
    Math.floor(
      remaining / 3600
    );


  remaining %=
    3600;


  const minutes =
    Math.floor(
      remaining / 60
    );


  const seconds =
    remaining % 60;


  const text =

    String(hours)
      .padStart(2,"0")

    + ":" +

    String(minutes)
      .padStart(2,"0")

    + ":" +

    String(seconds)
      .padStart(2,"0");


  return {

    closed:false,

    text:text,

    seconds:diff

  };

}


/* =====================================================
   LOAD GAMES
===================================================== */

async function loadButtons(){

  const gamesBox =
    document.getElementById(
      "games"
    );


  const {
    data,
    error
  } = await client

    .from("Game result")

    .select(
      "name, number, open, close"
    );


  if(error){

    console.log(
      "Game error:",
      error
    );


    gamesBox.innerHTML = `

      <div style="
        text-align:center;
        padding:20px;
        color:red;
      ">

        Games load नहीं हो पाई।

      </div>

    `;

    return;

  }


  if(
    !data ||
    !data.length
  ){

    gamesBox.innerHTML = `

      <div style="
        text-align:center;
        padding:20px;
        color:#777;
      ">

        कोई game उपलब्ध नहीं है।

      </div>

    `;

    return;

  }


  /*
     Local result system
     same रहेगा।
  */

  prepareLocalResults(
    data
  );


  /* =================================================
     SORT — TIMING FIX
     =================================================

     सबसे पहले:
     जो game अभी खुला है और
     जिसका CLOSE सबसे जल्दी है।

     उदाहरण:

     2:30 PM
     2:50 PM
     3:20 PM
     4:00 PM

     यही order रहेगा।

     बंद games हमेशा नीचे।
  */

  const games =
    [...data];


  games.sort(

    (a,b) => {

      const aTime =
        getRemainingTime(
          a.close
        );


      const bTime =
        getRemainingTime(
          b.close
        );


      /*
         A बंद है,
         B चालू है
         → B ऊपर
      */

      if(
        aTime.closed &&
        !bTime.closed
      ){

        return 1;

      }


      /*
         A चालू है,
         B बंद है
         → A ऊपर
      */

      if(
        !aTime.closed &&
        bTime.closed
      ){

        return -1;

      }


      /*
         दोनों चालू हैं
         → जिसको पहले close होना है
           वह सबसे ऊपर
      */

      if(
        !aTime.closed &&
        !bTime.closed
      ){

        return (
          aTime.seconds -
          bTime.seconds
        );

      }


      /*
         दोनों बंद हैं।
         उनका original Supabase order
         जैसा है वैसा ही रहेगा।
      */

      return 0;

    }

  );


  gamesBox.innerHTML =
    "";


  /* =================================================
     CREATE CARDS
  ================================================= */

  games.forEach(

    item => {

      const timeInfo =
        getRemainingTime(
          item.close
        );


      const card =
        document.createElement(
          "div"
        );


      card.className =
        "game-card";


      card.setAttribute(
        "data-close",
        item.close || ""
      );


      /*
         बंद game हल्की रहेगी।
      */

      if(
        timeInfo.closed
      ){

        card.style.opacity =
          "0.70";

      }


      const active =
        !timeInfo.closed;


      /*
         आज = Supabase number
         कल = localStorage
      */

      const todayResult =
        item.number ||
        "**";


      const kalResult =
        getKalResult(
          item.name
        );


      card.innerHTML = `

        <div class="game-top">

          <div class="game-name">

            ${active ? "🔥 " : ""}

            ${item.name || "--"}

          </div>


          <div class="game-time">

            OPEN:
            ${formatTimeAMPM(item.open)}

            &nbsp; | &nbsp;

            CLOSE:
            ${formatTimeAMPM(item.close)}

          </div>

        </div>


        <div class="game-middle">

          <div class="result-box">

            <div class="result-number">

              ${kalResult}

            </div>

            <div class="result-label">

              कल

            </div>

          </div>


          <div
            class="countdown ${
              timeInfo.closed
                ? "closed"
                : ""
            }">

            ${timeInfo.text}

          </div>


          <div class="result-box">

            <div class="result-number">

              ${todayResult}

            </div>

            <div class="result-label">

              आज

            </div>

          </div>

        </div>

      `;


      /*
         Closed game click नहीं होगी।
      */

      if(active){

        card.onclick = () => {

          localStorage.setItem(

            "market",

            item.name

          );


          window.location.href =
            "game.html";

        };

      }


      gamesBox.appendChild(
        card
      );

    }

  );

}


/* =====================================================
   COUNTDOWN UPDATE
===================================================== */

function updateCountdowns(){

  const cards =
    document.querySelectorAll(
      ".game-card"
    );


  let becameClosed =
    false;


  cards.forEach(

    card => {

      const closeTime =
        card.getAttribute(
          "data-close"
        );


      if(!closeTime){

        return;

      }


      const timeInfo =
        getRemainingTime(
          closeTime
        );


      const countdown =
        card.querySelector(
          ".countdown"
        );


      if(!countdown){

        return;

      }


      /*
         ACTIVE
      */

      if(
        !timeInfo.closed
      ){

        countdown.innerText =
          timeInfo.text;


        countdown.classList.remove(
          "closed"
        );


        card.style.opacity =
          "1";

      }


      /*
         CLOSED
      */

      else{

        /*
           पहली बार बंद हुआ।
           पूरे games को दोबारा sort करेंगे।
        */

        if(
          !countdown.classList.contains(
            "closed"
          )
        ){

          becameClosed =
            true;

        }


        countdown.innerText =
          "बंद";


        countdown.classList.add(
          "closed"
        );


        card.style.opacity =
          "0.70";


        card.onclick =
          null;

      }

    }

  );


  /*
     जैसे ही कोई game बंद हो,
     तुरंत list दोबारा sort होगी।
  */

  if(becameClosed){

    loadButtons();

  }


  /*
     7 AM आने पर reload।
  */

  const now =
    new Date();


  if(
    now.getHours() === 7 &&
    now.getMinutes() === 0 &&
    now.getSeconds() < 2
  ){

    loadButtons();

  }

}


/* =====================================================
   CHECK 7 AM GAME DAY
===================================================== */

let lastGameDay =
  getGameDay();


function checkGameDay(){

  const currentGameDay =
    getGameDay();


  if(
    currentGameDay !==
    lastGameDay
  ){

    lastGameDay =
      currentGameDay;


    loadButtons();

    loadWallet();

  }

}

===================================================== */

}

}


/* =====================================================
   START
===================================================== */

loadWallet();

loadButtons();


/*
   हर second countdown
*/

setInterval(

);


/*
   हर second check:
   क्या नया game-day शुरू हुआ?
*/

setInterval(

  checkGameDay,

  1000

);


/*
   हर 60 second Supabase refresh
*/

setInterval(

  () => {

    loadButtons();

    loadWallet();

  },

  60000

);

</script>
