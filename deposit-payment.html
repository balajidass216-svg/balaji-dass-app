<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Deposit Payment</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f6fa;
    color:#222;
}

.container{
    max-width:500px;
    margin:auto;
    padding:20px 15px 40px;
}

.card{
    background:#fff;
    border-radius:16px;
    padding:20px;
    box-shadow:0 4px 15px rgba(0,0,0,.08);
}

h2{
    text-align:center;
    margin:0 0 10px;
}

.subtitle{
    text-align:center;
    color:#777;
    font-size:14px;
    margin-bottom:20px;
}

.amountBox{
    text-align:center;
    background:#f5f5f5;
    padding:15px;
    border-radius:12px;
    margin-bottom:20px;
}

.amountLabel{
    font-size:13px;
    color:#777;
}

.amount{
    font-size:28px;
    font-weight:bold;
    margin-top:5px;
}

.upiBox{
    text-align:center;
    margin-bottom:18px;
}

.upiLabel{
    font-size:13px;
    color:#777;
}

.upiId{
    font-size:17px;
    font-weight:bold;
    word-break:break-all;
    margin-top:5px;
}

.qrBox{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:260px;
    margin:15px 0;
}

#qrcode{
    display:flex;
    justify-content:center;
    align-items:center;
}

.loading{
    text-align:center;
    color:#777;
}

.message{
    display:none;
    padding:11px;
    border-radius:8px;
    margin-top:12px;
    font-size:14px;
}

.error{
    background:#ffe5e5;
    color:#c00;
}

.success{
    background:#e5ffe9;
    color:green;
}

label{
    display:block;
    font-weight:bold;
    margin-top:20px;
    margin-bottom:8px;
}

input{
    width:100%;
    padding:13px;
    border:1px solid #ddd;
    border-radius:10px;
    font-size:16px;
    outline:none;
}

input:focus{
    border-color:#555;
}

button{
    width:100%;
    margin-top:15px;
    padding:14px;
    border:0;
    border-radius:10px;
    background:#222;
    color:#fff;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

button:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.backBtn{
    background:#777;
}
</style>
</head>

<body>

<div class="container">

    <div class="card">

        <h2>Payment</h2>

        <div class="subtitle">
            Scan QR and make payment
        </div>

        <div id="loading" class="loading">
            Payment request create ho rahi hai...
        </div>

        <div id="paymentContent" style="display:none;">

            <div class="amountBox">

                <div class="amountLabel">
                    Deposit Amount
                </div>

                <div id="amountDisplay" class="amount">
                    ₹0
                </div>

            </div>


            <div class="upiBox">

                <div class="upiLabel">
                    UPI ID
                </div>

                <div id="upiDisplay" class="upiId">
                    7KW0568000@mairtel
                </div>

            </div>


            <div class="qrBox">

                <div id="qrcode"></div>

            </div>


            <label for="utr">
                Enter User ID
            </label>

            <input
                type="text"
                id="utr"
                placeholder="Enter User ID"
                autocomplete="off"
            >


            <button
                id="submitBtn"
                onclick="submitUTR()"
            >
                Submit
            </button>


            <div
                id="message"
                class="message"
            ></div>


            <button
                class="backBtn"
                onclick="goBack()"
            >
                Back to Deposit
            </button>

        </div>

    </div>

</div>


<script>
const SUPABASE_URL =
    "https://glhomrlwnwhevunfubog.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_VihOz3hSXZzUiI9eANDL0A_EtaD-KIB";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


const userId =
    localStorage.getItem("user_id");


const UPI_ID =
    "7KW0568000@mairtel";


const params =
    new URLSearchParams(window.location.search);


const amountFromPage =
    Number(params.get("amount"));


let currentRequest = null;


function showMessage(message,type="error"){

    const box =
        document.getElementById("message");

    box.innerText = message;

    box.className =
        "message " + type;

    box.style.display = "block";
}


function hideMessage(){

    const box =
        document.getElementById("message");

    box.innerText = "";

    box.style.display = "none";
}


async function loadRequest(){

    try{

        if(!userId){

            throw new Error(
                "User login nahi mila. Please login again."
            );
        }


        if(
            !amountFromPage ||
            amountFromPage < 100 ||
            !Number.isInteger(amountFromPage)
        ){

            throw new Error(
                "Invalid deposit amount."
            );
        }


        /*
         * Last 5 minutes ka pending request check
         */

        const fiveMinutesAgo =
            new Date(
                Date.now() - 5 * 60 * 1000
            ).toISOString();


        const { data: existingRequest, error: checkError } =
            await supabaseClient
            .from("deposit_requests")
            .select(
                "id,user_id,mobile,amount,utr,screenshot,status,created_at,updated_at"
            )
            .eq("user_id", userId)
            .eq("amount", amountFromPage)
            .eq("status", "pending")
            .gte("created_at", fiveMinutesAgo)
            .order("created_at", {
                ascending:false
            })
            .limit(1)
            .maybeSingle();


        if(checkError){

            console.error(
                "Request check error:",
                checkError
            );

            throw new Error(
                "Request check nahi ho saki: " +
                checkError.message
            );
        }


        /*
         * Agar last 5 minutes me pending request hai
         * to wahi reuse karenge.
         */

        if(existingRequest){

            currentRequest =
                existingRequest;

        }else{

            /*
             * New pending request
             */

            const { data: newRequest, error: insertError } =
                await supabaseClient
                .from("deposit_requests")
                .insert({
                    user_id: userId,
                    amount: amountFromPage,
                    status: "pending"
                })
                .select(
                    "id,user_id,mobile,amount,utr,screenshot,status,created_at,updated_at"
                )
                .single();


            if(insertError){

                console.error(
                    "Deposit insert error:",
                    insertError
                );

                throw new Error(
                    "Deposit request create nahi hui: " +
                    insertError.message
                );
            }


            currentRequest =
                newRequest;
        }


        if(!currentRequest){

            throw new Error(
                "Deposit request nahi mili."
            );
        }


        if(currentRequest.status !== "pending"){

            throw new Error(
                "Ye deposit request pending nahi hai."
            );
        }


        /*
         * Amount display
         */

        document.getElementById(
            "amountDisplay"
        ).innerText =
            "₹" + Number(
                currentRequest.amount
            ).toFixed(0);


        /*
         * UPI ID display
         */

        document.getElementById(
            "upiDisplay"
        ).innerText =
            UPI_ID;


        /*
         * QR container
         */

        const qrBox =
            document.getElementById("qrcode");


        if(!qrBox){

            throw new Error(
                "QR container nahi mila."
            );
        }


        /*
         * QR library check
         */

        if(typeof QRCode === "undefined"){

            throw new Error(
                "QR Code library load nahi hui."
            );
        }


        /*
         * UPI payment string
         */

        const upiData =
            "upi://pay" +
            "?pa=" +
            encodeURIComponent(UPI_ID) +
            "&am=" +
            encodeURIComponent(
                Number(
                    currentRequest.amount
                ).toFixed(2)
            ) +
            "&cu=INR";


        console.log(
            "UPI QR Data:",
            upiData
        );


        /*
         * Purana QR clear
         */

        qrBox.innerHTML = "";


        /*
         * QR generate
         */

        new QRCode(
            qrBox,
            {
                text: upiData,
                width:240,
                height:240,
                correctLevel:
                    QRCode.CorrectLevel.M
            }
        );


        /*
         * Loading hide
         */

        document.getElementById(
            "loading"
        ).style.display = "none";


        /*
         * Payment content show
         */

        document.getElementById(
            "paymentContent"
        ).style.display = "block";


    }catch(error){

        console.error(
            "Payment page error:",
            error
        );


        document.getElementById(
            "loading"
        ).style.display = "none";


        showMessage(
            error.message ||
            "Payment page me error aa gaya.",
            "error"
        );
    }
}


async function submitUTR(){

    hideMessage();


    if(!currentRequest){

        showMessage(
            "Deposit request nahi mili.",
            "error"
        );

        return;
    }


    const input =
        document.getElementById("utr");


    const submitBtn =
        document.getElementById("submitBtn");


    const utr =
        input.value.trim();


    if(!utr){

        showMessage(
            "User ID enter karein.",
            "error"
        );

        input.focus();

        return;
    }


    submitBtn.disabled = true;

    submitBtn.innerText =
        "Submitting...";


    try{

        const { data, error } =
            await supabaseClient
            .from("deposit_requests")
            .update({
                utr: utr,
                updated_at:
                    new Date().toISOString()
            })
            .eq("id", currentRequest.id)
            .eq("user_id", userId)
            .eq("status", "pending")
            .select(
                "id,amount,utr,status,updated_at"
            )
            .single();


        if(error){

            console.error(
                "UTR update error:",
                error
            );

            throw new Error(
                "User ID save nahi hui: " +
                error.message
            );
        }


        if(!data){

            throw new Error(
                "Request update nahi hui."
            );
        }


        currentRequest =
            data;


        showMessage(
            "User ID successfully submit ho gayi.",
            "success"
        );


        submitBtn.innerText =
            "Submitted";


        /*
         * 1.5 second baad deposit history par
         */

        setTimeout(
            function(){
                window.location.href =
                    "deposit.html";
            },
            1500
        );


    }catch(error){

        console.error(error);


        showMessage(
            error.message ||
            "Submit nahi ho saka.",
            "error"
        );


        submitBtn.disabled =
            false;

        submitBtn.innerText =
            "Submit";
    }
}


function goBack(){

    window.location.href =
        "deposit.html";
}


/*
 * Page load
 */

loadRequest();
</script>

</body>
</html>
