
<!DOCTYPE html>
<html lang="hi">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Deposit</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#fff7e6,#ffe0b2);
  min-height:100vh;
  padding:20px 12px;
}

.container{
  width:100%;
  max-width:500px;
  margin:auto;
}

.card{
  background:#fff;
  border-radius:18px;
  padding:20px;
  margin-bottom:18px;
  box-shadow:0 5px 20px rgba(0,0,0,.10);
}

.title{
  text-align:center;
  font-size:25px;
  font-weight:bold;
  margin-bottom:22px;
  color:#222;
}

.label{
  font-size:15px;
  font-weight:bold;
  color:#444;
  margin-bottom:8px;
}

.amountInput{
  width:100%;
  height:52px;
  padding:0 14px;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:19px;
  outline:none;
}

.amountInput:focus{
  border-color:#ff9800;
}

.quickAmounts{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  margin-top:12px;
}

.quickBtn{
  border:0;
  background:#fff3e0;
  color:#e65100;
  padding:11px 4px;
  border-radius:9px;
  font-weight:bold;
  cursor:pointer;
}

.submitBtn{
  width:100%;
  height:52px;
  margin-top:18px;
  border:0;
  border-radius:11px;
  background:#ff9800;
  color:white;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

.submitBtn:disabled{
  background:#aaa;
}

.errorBox{
  display:none;
  margin-top:15px;
  padding:12px;
  border-radius:9px;
  background:#ffebee;
  color:#c62828;
  font-size:14px;
}

.historyTitle{
  font-size:20px;
  font-weight:bold;
  margin-bottom:15px;
}

.historyItem{
  border:1px solid #eee;
  border-radius:11px;
  padding:14px;
  margin-bottom:10px;
  background:#fafafa;
}

.row{
  display:flex;
  justify-content:space-between;
  gap:10px;
  margin-bottom:7px;
}

.labelSmall{
  color:#777;
  font-size:13px;
}

.value{
  font-weight:bold;
  font-size:14px;
  text-align:right;
}

.status{
  display:inline-block;
  padding:5px 9px;
  border-radius:7px;
  font-size:12px;
  font-weight:bold;
}

.pending{
  background:#fff3cd;
  color:#856404;
}

.accepted{
  background:#d4edda;
  color:#155724;
}

.cancelled{
  background:#f8d7da;
  color:#721c24;
}

.noHistory{
  text-align:center;
  color:#888;
  padding:20px 0;
}

</style>

</head>


<body>

<div class="container">

  <div class="card">

    <div class="title">
      Deposit
    </div>

    <div class="label">
      Enter Amount
    </div>

    <input
      id="amount"
      class="amountInput"
      type="number"
      min="100"
      inputmode="decimal"
      placeholder="Enter amount"
    >

    <div class="quickAmounts">

      <button
        class="quickBtn"
        type="button"
        onclick="setAmount(100)">
        ₹100
      </button>

      <button
        class="quickBtn"
        type="button"
        onclick="setAmount(200)">
        ₹200
      </button>

      <button
        class="quickBtn"
        type="button"
        onclick="setAmount(500)">
        ₹500
      </button>

      <button
        class="quickBtn"
        type="button"
        onclick="setAmount(1000)">
        ₹1000
      </button>

    </div>

    <button
      id="submitBtn"
      class="submitBtn"
      type="button"
      onclick="openPaymentPage()">

      Submit

    </button>

    <div
      id="errorBox"
      class="errorBox">
    </div>

  </div>


  <div class="card">

    <div class="historyTitle">
      Deposit History
    </div>

    <div id="history">
    </div>

  </div>

</div>


<script>

const SUPABASE_URL =
"https://glhomrlwnwhevunfubog.supabase.co";

const SUPABASE_KEY =
"sb_publishable_VihOz3hSXZzUiI9eANDL0A_EtaD-KIB";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


const userId =
localStorage.getItem("user_id");


function setAmount(amount){

  document.getElementById("amount").value =
  amount;

}


function showError(message){

  const box =
  document.getElementById("errorBox");

  box.innerText =
  message;

  box.style.display =
  "block";

}


function hideError(){

  const box =
  document.getElementById("errorBox");

  box.innerText =
  "";

  box.style.display =
  "none";

}


/*
 * IMPORTANT:
 *
 * Is page par request create nahi hoti.
 * Sirf QR/payment page open hota hai.
 */

function openPaymentPage(){

  hideError();

  const amountInput =
  document.getElementById("amount");

  const submitBtn =
  document.getElementById("submitBtn");

  const amount =
  Number(amountInput.value);


  if(!userId){

    showError(
      "User login nahi mila."
    );

    return;

  }


if(!amount || amount < 100){

  showError(
    "Minimum deposit ₹100 hai."
  );

  return;

}


  submitBtn.disabled =
  true;

  submitBtn.innerText =
  "Opening...";


  window.location.href =
    "deposit-payment.html?amount=" +
    encodeURIComponent(amount);

}


function getStatusHTML(status){

  const value =
  String(status || "")
  .toLowerCase();


  if(
    value === "accepted" ||
    value === "approved" ||
    value === "success"
  ){

    return `
      <span class="status accepted">
        Accepted
      </span>
    `;

  }


  if(
    value === "cancelled" ||
    value === "canceled" ||
    value === "rejected"
  ){

    return `
      <span class="status cancelled">
        Cancelled
      </span>
    `;

  }


  return `
    <span class="status pending">
      Pending
    </span>
  `;

}


function formatDate(value){

  if(!value)
    return "-";


  const date =
  new Date(value);


  if(isNaN(date.getTime()))
    return value;


  return date.toLocaleString(
    "en-IN",
    {
      day:"2-digit",
      month:"2-digit",
      year:"numeric",
      hour:"2-digit",
      minute:"2-digit",
      hour12:true
    }
  );

}


async function loadHistory(){

  const history =
  document.getElementById("history");


  if(!userId){

    history.innerHTML =
    `<div class="noHistory">
      Login required
    </div>`;

    return;

  }


  const {
    data,
    error
  } = await supabaseClient

    .from("deposit_requests")

    .select(
      "id,amount,utr,status,created_at"
    )

    .eq(
      "user_id",
      userId
    )

    .order(
      "created_at",
      {
        ascending:false
      }
    );


  if(error){

    console.error(error);

    history.innerHTML =
    `<div class="noHistory">
      History load nahi hui.
    </div>`;

    return;

  }


  if(!data || data.length === 0){

    history.innerHTML =
    `<div class="noHistory">
      No deposit history
    </div>`;

    return;

  }


  history.innerHTML =
  "";


  data.forEach(item => {

    const div =
    document.createElement("div");

    div.className =
    "historyItem";


    div.innerHTML = `

      <div class="row">

        <div class="labelSmall">
          Amount
        </div>

        <div class="value">
          ₹${Number(item.amount || 0).toFixed(2)}
        </div>

      </div>


      <div class="row">

        <div class="labelSmall">
          UTR
        </div>

        <div class="value">
          ${item.utr || "-"}
        </div>

      </div>


      <div class="row">

        <div class="labelSmall">
          Status
        </div>

        <div class="value">
          ${getStatusHTML(item.status)}
        </div>

      </div>


      <div class="row">

        <div class="labelSmall">
          Date
        </div>

        <div class="value">
          ${formatDate(item.created_at)}
        </div>

      </div>

    `;


    history.appendChild(div);

  });

}


loadHistory();


setInterval(
  loadHistory,
  5000
);

</script>

</body>

</html>
