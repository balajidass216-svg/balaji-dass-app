<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Deposit</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f3f4f6;
}

.container{
    max-width:420px;
    margin:40px auto;
    padding:20px;
}

.box{
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 5px 20px rgba(0,0,0,0.10);
}

h2{
    text-align:center;
    margin-top:0;
}

label{
    display:block;
    margin-bottom:8px;
    font-weight:bold;
}

input{
    width:100%;
    padding:14px;
    border:1px solid #ccc;
    border-radius:10px;
    font-size:17px;
    outline:none;
}

button{
    width:100%;
    margin-top:18px;
    padding:14px;
    border:0;
    border-radius:10px;
    background:#16a34a;
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

button:disabled{
    background:#999;
}

.info{
    margin-top:18px;
    padding:12px;
    background:#f1f5f9;
    border-radius:10px;
    font-size:14px;
}

#message{
    margin-top:15px;
    text-align:center;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="container">

    <div class="box">

        <h2>Deposit Money</h2>

        <label>Amount</label>

        <input
            type="number"
            id="amount"
            min="1"
            step="1"
            placeholder="Enter amount"
        >

        <button id="payBtn" onclick="createDeposit()">
            PAY NOW
        </button>

        <div class="info">
            <b>Payment UPI:</b><br>
            8901239533@amazonpay
        </div>

        <div id="message"></div>

    </div>

</div>


<script>

const SUPABASE_URL =
"https://glhomrlwnwhevunfubog.supabase.co";

const SUPABASE_KEY =
"sb_publishable_VihOz3hSXZzUiI9eANDL0A_EtaD-KIB";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


// -----------------------------
// CREATE DEPOSIT
// -----------------------------

async function createDeposit(){

    const amountInput =
        document.getElementById("amount");

    const button =
        document.getElementById("payBtn");

    const message =
        document.getElementById("message");

    const amount =
        Number(amountInput.value);


    // Amount check
    if(!amount || amount <= 0){

        message.style.color = "red";
        message.innerText =
            "Please enter a valid amount.";

        return;
    }


    // Logged-in user
    const savedUser =
        localStorage.getItem("user");

    if(!savedUser){

        alert("Please login first.");

        return;
    }


    let user;

    try{

        user = JSON.parse(savedUser);

    }catch(e){

        alert("Login session invalid. Please login again.");

        return;
    }


    // User ID check
    if(!user.id){

        alert("User ID nahi mila. Please login again.");

        return;
    }


    button.disabled = true;
    button.innerText = "Creating Request...";


    // Save deposit request
    const { data, error } =
        await supabaseClient
        .from("deposits")
        .insert([
            {
                user_id: user.id,
                amount: amount,
                status: "pending"
            }
        ])
        .select()
        .single();


    if(error){

        console.error(error);

        message.style.color = "red";

        message.innerText =
            "Deposit request create nahi hui.";

        button.disabled = false;
        button.innerText = "PAY NOW";

        return;
    }


    // -----------------------------
    // OPEN UPI PAYMENT
    // -----------------------------

    const upiId =
        "8901239533@amazonpay";

    const payeeName =
        "Deposit";


    const transactionId =
        "DEP" + data.id + "_" + Date.now();


    const upiUrl =
        "upi://pay" +
        "?pa=" + encodeURIComponent(upiId) +
        "&pn=" + encodeURIComponent(payeeName) +
        "&am=" + encodeURIComponent(amount.toFixed(2)) +
        "&cu=INR" +
        "&tr=" + encodeURIComponent(transactionId);


    message.style.color = "green";

    message.innerText =
        "Deposit request created. Payment app opening...";


    setTimeout(() => {

        window.location.href = upiUrl;

    }, 500);

}

</script>

</body>
</html>
