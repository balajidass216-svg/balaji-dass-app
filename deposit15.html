<!DOCTYPE html>
<html lang="hi">

<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Deposit</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#fff7e6,#ffe0b2);
  min-height:100vh;
  padding:20px 12px;
}

.container{
  width:100%;
  max-width:500px;
  margin:auto;
}

.depositCard,
.historyCard{
  background:#fff;
  border-radius:18px;
  padding:20px;
  margin-bottom:18px;
  box-shadow:0 5px 20px rgba(0,0,0,.10);
}

.title{
  text-align:center;
  font-size:24px;
  font-weight:bold;
  color:#222;
  margin-bottom:20px;
}

.label{
  font-size:15px;
  font-weight:bold;
  color:#444;
  margin-bottom:8px;
}

.amountInput{
  width:100%;
  height:50px;
  padding:0 14px;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:18px;
  outline:none;
}

.amountInput:focus{
  border-color:#ff9800;
}

.quickAmounts{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  margin-top:12px;
}

.quickBtn{
  border:none;
  background:#fff3e0;
  color:#e65100;
  padding:11px 5px;
  border-radius:9px;
  font-weight:bold;
  cursor:pointer;
}

.quickBtn:active{
  transform:scale(.97);
}

.payBtn{
  width:100%;
  height:52px;
  margin-top:18px;
  border:none;
  border-radius:11px;
  background:#ff9800;
  color:#fff;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

.payBtn:disabled{
  background:#aaa;
}

.upiBox{
  margin-top:18px;
  padding:14px;
  border-radius:10px;
  background:#f5f5f5;
  text-align:center;
}

.upiTitle{
  font-size:13px;
  color:#777;
  margin-bottom:5px;
}

.upiId{
  font-size:17px;
  font-weight:bold;
  color:#222;
  word-break:break-all;
}

.errorBox{
  display:none;
  margin-top:15px;
  padding:12px;
  border-radius:9px;
  background:#ffebee;
  color:#c62828;
  font-size:14px;
}

.currentRequest{
  display:none;
  margin-top:15px;
  padding:14px;
  border-radius:10px;
  background:#fff8e1;
  border:1px solid #ffe082;
}

.currentTitle{
  font-weight:bold;
  margin-bottom:7px;
}

.historyTitle{
  font-size:20px;
  font-weight:bold;
  margin-bottom:15px;
}

.historyItem{
  border:1px solid #eee;
  border-radius:10px;
  padding:13px;
  margin-bottom:10px;
  background:#fafafa;
}

.historyRow{
  display:flex;
  justify-content:space-between;
  gap:10px;
  margin-bottom:6px;
}

.historyLabel{
  color:#777;
  font-size:13px;
}

.historyValue{
  font-weight:bold;
  font-size:14px;
  text-align:right;
}

.status{
  display:inline-block;
  padding:5px 9px;
  border-radius:7px;
  font-size:12px;
  font-weight:bold;
}

.statusPending{
  background:#fff3cd;
  color:#856404;
}

.statusAccepted{
  background:#d4edda;
  color:#155724;
}

.statusCancelled{
  background:#f8d7da;
  color:#721c24;
}

.noHistory{
  text-align:center;
  color:#888;
  padding:20px 0;
}

</style>
</head>


<body>

<div class="container">

  <div class="depositCard">

    <div class="title">
      Deposit
    </div>

    <div class="label">
      Enter Amount
    </div>

    <input
      id="amount"
      class="amountInput"
      type="number"
      min="1"
      inputmode="decimal"
      placeholder="Enter amount"
    >

    <div class="quickAmounts">

      <button
        type="button"
        class="quickBtn"
        onclick="setAmount(100)">
        ₹100
      </button>

      <button
        type="button"
        class="quickBtn"
        onclick="setAmount(200)">
        ₹200
      </button>

      <button
        type="button"
        class="quickBtn"
        onclick="setAmount(500)">
        ₹500
      </button>

      <button
        type="button"
        class="quickBtn"
        onclick="setAmount(1000)">
        ₹1000
      </button>

    </div>


    <button
      type="button"
      id="payBtn"
      class="payBtn"
      onclick="payNow()">
      Pay Now
    </button>


    <div class="upiBox">

      <div class="upiTitle">
        Payment UPI ID
      </div>

      <div class="upiId">
        7KW0568000@mairtel
      </div>

    </div>


    <div
      id="errorBox"
      class="errorBox">
    </div>


    <div
      id="currentRequest"
      class="currentRequest">

      <div class="currentTitle">
        Current Deposit
      </div>

      <div id="currentRequestText">
      </div>

    </div>

  </div>


  <div class="historyCard">

    <div class="historyTitle">
      Deposit History
    </div>

    <div id="history">
    </div>

  </div>

</div>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://glhomrlwnwhevunfubog.supabase.co";

const SUPABASE_KEY =
"sb_publishable_VihOz3hSXZzUiI9eANDL0A_EtaD-KIB";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =========================
   USER
========================= */

const userId =
localStorage.getItem("user_id");


/* =========================
   AMOUNT
========================= */

function setAmount(amount){

  document.getElementById("amount").value =
    amount;

}


/* =========================
   ERROR
========================= */

function showError(message){

  const errorBox =
    document.getElementById("errorBox");

  errorBox.innerText =
    message;

  errorBox.style.display =
    "block";

}


function hideError(){

  const errorBox =
    document.getElementById("errorBox");

  errorBox.innerText =
    "";

  errorBox.style.display =
    "none";

}


/* =========================
   PAY NOW
========================= */

async function payNow(){

  hideError();

  const amountInput =
    document.getElementById("amount");

  const payBtn =
    document.getElementById("payBtn");

  const amount =
    Number(amountInput.value);


  /* USER CHECK */

  if(!userId){

    showError(
      "User login nahi mila."
    );

    return;
  }


  /* AMOUNT CHECK */

  if(!amount || amount <= 0){

    showError(
      "Please valid amount enter karein."
    );

    return;
  }


  payBtn.disabled =
    true;

  payBtn.innerText =
    "Processing...";


  /* =========================
     CREATE PENDING REQUEST
  ========================= */

  const { data, error } =
    await supabaseClient

    .from("deposit_requests")

    .insert({

      user_id: userId,

      amount: amount,

      status: "pending"

    })

    .select()

    .single();


  if(error){

    console.error(error);

    showError(
      "Deposit request create nahi hui."
    );

    payBtn.disabled =
      false;

    payBtn.innerText =
      "Pay Now";

    return;
  }


  /* =========================
     UPI PAYMENT
  ========================= */

  const upiId =
    "7KW0568000@mairtel";


  const upiUrl =
    "upi://pay" +

    "?pa=" +
    encodeURIComponent(upiId) +

    "&am=" +
    encodeURIComponent(
      amount.toFixed(2)
    ) +

    "&cu=INR";


  /* SHOW PENDING REQUEST */

  showCurrentRequest(data);

  loadHistory();


  /* OPEN UPI APP */

  window.location.href =
    upiUrl;


  payBtn.disabled =
    false;

  payBtn.innerText =
    "Pay Now";

}


/* =========================
   CURRENT REQUEST
========================= */

function showCurrentRequest(request){

  const box =
    document.getElementById(
      "currentRequest"
    );

  const text =
    document.getElementById(
      "currentRequestText"
    );


  if(!request){

    box.style.display =
      "none";

    return;
  }


  text.innerHTML = `

    <div>
      Amount:
      <b>
        ₹${Number(request.amount).toFixed(2)}
      </b>
    </div>

    <div style="margin-top:6px;">

      Status:

      <span class="status statusPending">
        Pending
      </span>

    </div>

  `;


  box.style.display =
    "block";

}


/* =========================
   STATUS
========================= */

function getStatusHTML(status){

  const value =
    String(status || "")
    .toLowerCase();


  if(
    value === "accepted" ||
    value === "approved" ||
    value === "success"
  ){

    return `
      <span class="status statusAccepted">
        Accepted
      </span>
    `;

  }


  if(
    value === "cancelled" ||
    value === "canceled" ||
    value === "rejected"
  ){

    return `
      <span class="status statusCancelled">
        Cancelled
      </span>
    `;

  }


  return `
    <span class="status statusPending">
      Pending
    </span>
  `;

}


/* =========================
   DATE
========================= */

function formatDate(dateValue){

  if(!dateValue)
    return "-";


  const date =
    new Date(dateValue);


  if(
    isNaN(
      date.getTime()
    )
  ){

    return dateValue;

  }


  return date.toLocaleString(
    "en-IN",
    {
      day:"2-digit",
      month:"2-digit",
      year:"numeric",
      hour:"2-digit",
      minute:"2-digit",
      hour12:true
    }
  );

}


/* =========================
   HISTORY
========================= */

async function loadHistory(){

  const history =
    document.getElementById(
      "history"
    );


  if(!userId){

    history.innerHTML = `
      <div class="noHistory">
        Login required
      </div>
    `;

    return;
  }


  const { data, error } =
    await supabaseClient

    .from("deposit_requests")

    .select("*")

    .eq(
      "user_id",
      userId
    )

    .order(
      "created_at",
      {
        ascending:false
      }
    );


  if(error){

    console.error(error);

    history.innerHTML = `
      <div class="noHistory">
        History load nahi hui.
      </div>
    `;

    return;
  }


  if(
    !data ||
    data.length === 0
  ){

    history.innerHTML = `
      <div class="noHistory">
        No deposit history
      </div>
    `;

    return;
  }


  history.innerHTML =
    "";


  data.forEach(item => {

    const div =
      document.createElement(
        "div"
      );


    div.className =
      "historyItem";


    div.innerHTML = `

      <div class="historyRow">

        <div class="historyLabel">
          Amount
        </div>

        <div class="historyValue">
          ₹${Number(item.amount || 0).toFixed(2)}
        </div>

      </div>


      <div class="historyRow">

        <div class="historyLabel">
          Status
        </div>

        <div class="historyValue">

          ${getStatusHTML(item.status)}

        </div>

      </div>


      <div class="historyRow">

        <div class="historyLabel">
          Date
        </div>

        <div class="historyValue">

          ${formatDate(item.created_at)}

        </div>

      </div>

    `;


    history.appendChild(
      div
    );

  });

}


/* =========================
   START
========================= */

loadHistory();


/* Refresh history every 5 seconds */

setInterval(
  loadHistory,
  5000
);

</script>

</body>
</html>
