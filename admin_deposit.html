<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deposit</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f6fa;
    color:#222;
}

.container{
    max-width:500px;
    margin:auto;
    padding:20px 15px 40px;
}

.card{
    background:#fff;
    border-radius:16px;
    padding:20px;
    box-shadow:0 4px 15px rgba(0,0,0,.08);
}

h2{
    text-align:center;
    margin:0 0 20px;
}

label{
    display:block;
    font-weight:bold;
    margin-bottom:8px;
}

input{
    width:100%;
    padding:13px;
    border:1px solid #ddd;
    border-radius:10px;
    font-size:16px;
    outline:none;
}

input:focus{
    border-color:#555;
}

button{
    width:100%;
    margin-top:15px;
    padding:14px;
    border:0;
    border-radius:10px;
    background:#222;
    color:#fff;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

button:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.error{
    display:none;
    margin-top:12px;
    padding:10px;
    background:#ffe5e5;
    color:#c00;
    border-radius:8px;
    font-size:14px;
}

.history-title{
    margin-top:25px;
    font-size:18px;
    font-weight:bold;
}

.history{
    margin-top:10px;
}

.item{
    background:#fff;
    padding:14px;
    margin-bottom:10px;
    border-radius:12px;
    box-shadow:0 2px 8px rgba(0,0,0,.06);
}

.row{
    display:flex;
    justify-content:space-between;
    gap:10px;
    margin-bottom:6px;
}

.amount{
    font-weight:bold;
}

.status{
    font-weight:bold;
}

.pending{
    color:#d88a00;
}

.accepted{
    color:green;
}

.rejected,
.cancelled{
    color:red;
}

.empty{
    background:#fff;
    padding:15px;
    text-align:center;
    border-radius:10px;
    color:#777;
}
</style>
</head>

<body>

<div class="container">

    <div class="card">
        <h2>Deposit</h2>

        <label for="amount">Enter Amount</label>

        <input
            type="number"
            id="amount"
            placeholder="Minimum ₹100"
            min="100"
            step="1"
        >

        <button id="submitBtn" onclick="openPaymentPage()">
            Continue to Payment
        </button>

        <div id="error" class="error"></div>
    </div>

    <div class="history-title">
        Deposit History
    </div>

    <div id="history" class="history">
        <div class="empty">Loading...</div>
    </div>

</div>

<script>
const SUPABASE_URL = "https://glhomrlwnwhevunfubog.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_VihOz3hSXZzUiI9eANDL0A_EtaD-KIB";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );

const userId = localStorage.getItem("user_id");

function showError(message){
    const error = document.getElementById("error");

    error.innerText = message;
    error.style.display = "block";
}

function hideError(){
    const error = document.getElementById("error");

    error.innerText = "";
    error.style.display = "none";
}

function openPaymentPage(){

    hideError();

    const amountInput =
        document.getElementById("amount");

    const submitBtn =
        document.getElementById("submitBtn");

    const amount =
        Number(amountInput.value);

    if(!userId){
        showError("User login nahi mila.");
        return;
    }

    if(!amount || amount < 100){
        showError("Minimum deposit ₹100 hai.");
        return;
    }

    if(!Number.isInteger(amount)){
        showError("Amount whole number me enter karein.");
        return;
    }

    submitBtn.disabled = true;
    submitBtn.innerText = "Opening...";

    window.location.href =
        "deposit-payment.html?amount=" +
        encodeURIComponent(amount);
}


async function loadHistory(){

    const history =
        document.getElementById("history");

    if(!userId){

        history.innerHTML =
            '<div class="empty">User login nahi mila.</div>';

        return;
    }

    try{

        const { data, error } =
            await supabaseClient
            .from("deposit_requests")
            .select(
                "id,amount,utr,status,created_at,updated_at"
            )
            .eq("user_id", userId)
            .order("created_at", {
                ascending:false
            });

        if(error){
            console.error(error);

            history.innerHTML =
                '<div class="empty">History load nahi ho saki.</div>';

            return;
        }

        if(!data || data.length === 0){

            history.innerHTML =
                '<div class="empty">No deposit history.</div>';

            return;
        }

        history.innerHTML = data.map(item => {

            const amount =
                Number(item.amount || 0);

            const status =
                String(item.status || "pending")
                .toLowerCase();

            const date =
                item.created_at
                ? new Date(item.created_at).toLocaleString("en-IN")
                : "";

            const utr =
                item.utr
                ? item.utr
                : "Not submitted";

            return `
                <div class="item">

                    <div class="row">
                        <span>Amount</span>
                        <span class="amount">
                            ₹${amount}
                        </span>
                    </div>

                    <div class="row">
                        <span>Status</span>
                        <span class="status ${status}">
                            ${status.toUpperCase()}
                        </span>
                    </div>

                    <div class="row">
                        <span>User ID</span>
                        <span>${escapeHtml(utr)}</span>
                    </div>

                    <div class="row">
                        <span>Date</span>
                        <span>${date}</span>
                    </div>

                </div>
            `;

        }).join("");

    }catch(err){

        console.error(err);

        history.innerHTML =
            '<div class="empty">History load nahi ho saki.</div>';
    }
}


function escapeHtml(value){

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}


loadHistory();

setInterval(loadHistory,5000);
</script>

</body>
</html>
