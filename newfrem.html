/* =========================
   MASK MOBILE NUMBER
========================= */

function maskMobile(number){

  if(!number){
    return "****";
  }

  const mobile = String(number).trim();

  if(mobile.length <= 4){
    return mobile;
  }

  return "*".repeat(mobile.length - 4) +
         mobile.slice(-4);

}
