```html
<!DOCTYPE html>
<html lang="hi">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Deposit</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f3f4f6;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}

.depositBox{
  width:92%;
  max-width:400px;
  background:white;
  padding:25px;
  border-radius:20px;
  box-shadow:0 4px 15px rgba(0,0,0,.15);
}

h2{
  text-align:center;
  margin-top:0;
}

label{
  display:block;
  margin-bottom:7px;
  font-weight:bold;
}

input{
  width:100%;
  padding:14px;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:18px;
  outline:none;
}

input:focus{
  border-color:#d19b19;
}

.payBtn{
  width:100%;
  margin-top:18px;
  padding:14px;
  border:0;
  border-radius:11px;
  background:#159447;
  color:white;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

.payBtn:active{
  transform:scale(.98);
}

.upiInfo{
  margin-top:18px;
  padding:12px;
  background:#f5f5f5;
  border-radius:10px;
  text-align:center;
  font-size:13px;
  color:#555;
}

</style>

</head>


<body>


<div class="depositBox">

  <h2>💰 Deposit</h2>


  <label>
    Amount
  </label>


  <input
    id="amount"
    type="number"
    inputmode="decimal"
    min="1"
    step="1"
    placeholder="Amount enter karein">


  <button
    class="payBtn"
    onclick="payNow()">

    Pay Now

  </button>


  <div class="upiInfo">

    Payment UPI:<br>

    <b>8901239533@amazonpay</b>

  </div>

</div>



<script>

function payNow(){

  const amountInput =
    document.getElementById("amount");

  const amount =
    Number(amountInput.value);


  /* =========================
     VALIDATE AMOUNT
  ========================= */

  if(
    !amount ||
    amount <= 0
  ){

    alert(
      "Pehle valid amount enter karein."
    );

    amountInput.focus();

    return;

  }


  /* =========================
     UPI PAYMENT
  ========================= */

  const upiId =
    "8901239533@amazonpay";

  const payeeName =
    "Deposit";


  const transactionId =
    "DEP" +
    Date.now();


  const upiUrl =
    "upi://pay" +
    "?pa=" +
    encodeURIComponent(upiId) +
    "&pn=" +
    encodeURIComponent(payeeName) +
    "&am=" +
    encodeURIComponent(amount.toFixed(2)) +
    "&cu=INR" +
    "&tr=" +
    encodeURIComponent(transactionId);


  /* =========================
     OPEN UPI APP
  ========================= */

  window.location.href = upiUrl;

}

</script>


</body>

</html>
```
