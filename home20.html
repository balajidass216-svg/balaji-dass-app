/* =========================
   FORMAT TIME AM / PM
========================= */

function formatTimeAMPM(time){

  if(!time) return "--";

  const parts =
    time.split(":");

  let hour =
    Number(parts[0]);

  const minute =
    Number(parts[1]);

  const suffix =
    hour >= 12 ? "PM" : "AM";

  hour =
    hour % 12 || 12;

  return (
    hour +
    ":" +
    String(minute).padStart(2,"0") +
    " " +
    suffix
  );

}


/* =========================
   GET CLOSE TIME
========================= */

function getCloseDate(closeTime){

  if(!closeTime) return null;

  const parts = closeTime.split(":");

  const ch = Number(parts[0]);
  const cm = Number(parts[1]);

  const now = new Date();
  const close = new Date(now);

  close.setHours(ch, cm, 0, 0);

  // Game day: 5:50 AM से शुरू होता है
  // और अगले दिन 5:49 AM तक चलता है

  if(
    now.getHours() < 5 ||
    (
      now.getHours() === 5 &&
      now.getMinutes() < 50
    )
  ){

    // अभी 5:50 AM नहीं हुआ,
    // इसलिए आज की 5:50 AM से पहले वाली
    // timings पिछले game-day की हैं.

    if(
      ch >= 5 &&
      cm >= 50
    ){

      close.setDate(
        close.getDate() - 1
      );

    }

  }
  else{

    // 5:50 AM के बाद हैं.
    // 5:50 AM से पहले वाली timing
    // अगले दिन की मानी जाएगी.

    if(
      ch < 5 ||
      (
        ch === 5 &&
        cm < 50
      )
    ){

      close.setDate(
        close.getDate() + 1
      );

    }

  }

  return close;

}


/* =========================
   REMAINING TIME
========================= */

function getRemainingTime(closeTime){

  const close =
    getCloseDate(closeTime);

  if(!close){

    return {

      closed:true,

      text:"बंद",

      seconds:0

    };

  }

  const now =
    new Date();

  let diff =
    Math.floor(
      (
        close.getTime() -
        now.getTime()
      ) / 1000
    );


  if(diff <= 0){

    return {

      closed:true,

      text:"बंद",

      seconds:0

    };

  }


  const hours =
    Math.floor(
      diff / 3600
    );


  diff =
    diff % 3600;


  const minutes =
    Math.floor(
      diff / 60
    );


  const seconds =
    diff % 60;


  const text =

    String(hours)
      .padStart(2,"0")

    + ":" +

    String(minutes)
      .padStart(2,"0")

    + ":" +

    String(seconds)
      .padStart(2,"0");


  return {

    closed:false,

    text:text,

    seconds:
      hours * 3600 +
      minutes * 60 +
      seconds

  };

}


/* =========================
   LOAD GAMES
========================= */

async function loadButtons(){

  const container =
    document.getElementById(
      "container"
    );


  container.innerHTML = `

    <div class="noData">
      Loading games...
    </div>

  `;


  try{

    const {
      data,
      error
    } = await client

      .from("Game result")

      .select(
        "name, number, open, close"
      );


    if(error){

      console.log(
        "GAME ERROR:",
        error
      );


      container.innerHTML = `

        <div class="noData">
          Game data load nahi hua
        </div>

      `;

      return;

    }


    if(
      !data ||
      data.length === 0
    ){

      container.innerHTML = `

        <div class="noData">
          No games found
        </div>

      `;

      return;

    }


    /* =========================
       SORT BY LAST TIMING
    ========================= */

    data.sort((a,b)=>{

      const aTime =
        getRemainingTime(
          a.close
        );


      const bTime =
        getRemainingTime(
          b.close
        );


      /*
         Active game upar
      */

      if(
        !aTime.closed &&
        bTime.closed
      ){

        return -1;

      }


      /*
         Closed game neeche
      */

      if(
        aTime.closed &&
        !bTime.closed
      ){

        return 1;

      }


      /*
         Dono active hain:

         Jiski close timing
         sabse pehle aayegi
         wo sabse upar.
      */

      if(
        !aTime.closed &&
        !bTime.closed
      ){

        return (
          aTime.seconds -
          bTime.seconds
        );

      }


      /*
         Dono closed hain.
         Original order maintain.
      */

      return 0;

    });


    container.innerHTML = "";


    /* =========================
       CREATE GAME CARDS
    ========================= */

    data.forEach(item=>{

      const timeInfo =
        getRemainingTime(
          item.close
        );


      const isOpen =
        !timeInfo.closed;


      const btn =
        document.createElement(
          "div"
        );


      btn.className =
        "btn";


      btn.innerHTML = `

        <div class="gameTop">

          <div class="gameTimeLabel">

            OPEN:

            <span>
              ${item.open || "--"}
            </span>

          </div>


          <div class="gameTimeLabel">

            CLOSE:

            <span>
              ${formatTimeAMPM(item.close)}
            </span>

          </div>

        </div>


        <div class="gameName">

          ${item.name || "Game"}

          ${isOpen ? " 🔥" : ""}

        </div>


        <div class="gameNumberRow">


          <div class="numberBox">

            <div class="gameNumber">

              ${getKalResult(item.name)}

            </div>

            <div class="numberLabel">

              कल

            </div>

          </div>


          <div class="arrow">

            ›

          </div>


          <div class="numberBox">

            <div class="gameNumber">

              ${item.number || "XX"}

            </div>

            <div class="numberLabel">

              आज

            </div>

          </div>


        </div>


        <div
          class="statusBox ${
            isOpen
            ? "countdown"
            : "closed"
          }"
          data-close="${item.close || ""}"
        >

          ${
            isOpen
            ? "⏳ " + timeInfo.text
            : "🔒 बंद"
          }

        </div>

      `;


      /* =========================
         OPEN GAME
      ========================= */

      if(isOpen){

        btn.onclick =
          ()=>{

            localStorage.setItem(
              "market",
              item.name
            );


            window.location.href =
              "game.html";

          };

      }

      else{

        btn.style.opacity =
          "0.70";

      }


      container.appendChild(
        btn
      );

    });

  }

  catch(error){

    console.log(error);


    container.innerHTML = `

      <div class="noData">
        Something went wrong
      </div>

    `;

  }

}


/* =========================
   LIVE COUNTDOWN
========================= */

function updateCountdowns(){

  let timeOver =
    false;


  document
    .querySelectorAll(
      ".statusBox[data-close]"
    )
    .forEach(box=>{

      const closeTime =
        box.getAttribute(
          "data-close"
        );


      const timeInfo =
        getRemainingTime(
          closeTime
        );


      if(timeInfo.closed){

        /*
           Agar pehle countdown tha
           aur abhi closed hua hai,
           to list ko ek baar reload
           karna hai.
        */

        if(
          box.classList.contains(
            "countdown"
          )
        ){

          timeOver = true;

        }


        box.classList.remove(
          "countdown"
        );

        box.classList.add(
          "closed"
        );

        box.innerText =
          "🔒 बंद";

      }

      else{

        box.classList.remove(
          "closed"
        );

        box.classList.add(
          "countdown"
        );

        box.innerText =
          "⏳ " +
          timeInfo.text;

      }

    });


  /*
     Sirf jab koi game
     abhi-abhi time-over hua ho
     tab list reload hogi.
  */

  if(timeOver){

    loadButtons();

  }

}


setInterval(
  updateCountdowns,
  1000
);
