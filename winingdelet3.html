<!DOCTYPE html>
<html lang="hi">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Admin Wining Delete</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#f4f6f9;
    color:#222;
}

/* ================= HEADER ================= */

.header{
    background:linear-gradient(135deg,#111827,#1f2937);
    color:white;
    padding:18px 15px;
    text-align:center;
    font-size:22px;
    font-weight:bold;
    box-shadow:0 3px 10px rgba(0,0,0,.15);
}

/* ================= MAIN ================= */

.container{
    width:100%;
    max-width:900px;
    margin:auto;
    padding:15px;
}

/* ================= FILTER BOX ================= */

.filter-box{
    background:white;
    border-radius:14px;
    padding:16px;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
    margin-bottom:15px;
}

.filter-title{
    font-size:17px;
    font-weight:bold;
    margin-bottom:12px;
}

.filter-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.select-box{
    width:100%;
    padding:13px 12px;
    border:1px solid #d1d5db;
    border-radius:10px;
    background:white;
    font-size:15px;
    outline:none;
}

.select-box:focus{
    border-color:#2563eb;
}

/* ================= WARNING ================= */

.warning{
    background:#fff7ed;
    border:1px solid #fdba74;
    color:#9a3412;
    border-radius:10px;
    padding:11px 12px;
    margin-top:12px;
    font-size:13px;
    line-height:1.5;
}

/* ================= SUMMARY ================= */

.summary{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    margin-bottom:15px;
}

.summary-card{
    background:white;
    border-radius:12px;
    padding:13px 8px;
    text-align:center;
    box-shadow:0 3px 10px rgba(0,0,0,.07);
}

.summary-number{
    font-size:20px;
    font-weight:bold;
    margin-bottom:4px;
}

.summary-label{
    font-size:12px;
    color:#6b7280;
}

/* ================= EMPTY ================= */

.empty{
    background:white;
    border-radius:14px;
    padding:30px 15px;
    text-align:center;
    color:#6b7280;
    box-shadow:0 3px 10px rgba(0,0,0,.07);
}

/* ================= WINING CARD ================= */

.wining-list{
    display:flex;
    flex-direction:column;
    gap:12px;
}

.wining-card{
    background:white;
    border-radius:14px;
    padding:15px;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
    border-left:5px solid #dc2626;
}

.card-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-bottom:12px;
}

.number{
    font-size:25px;
    font-weight:bold;
    color:#111827;
}

.status{
    padding:5px 9px;
    border-radius:20px;
    font-size:11px;
    font-weight:bold;
}

.status-pending{
    background:#fef3c7;
    color:#92400e;
}

.status-accepted{
    background:#dcfce7;
    color:#166534;
}

.status-cancelled{
    background:#fee2e2;
    color:#991b1b;
}

.details{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-bottom:13px;
}

.detail{
    background:#f8fafc;
    border-radius:8px;
    padding:9px;
}

.detail-label{
    font-size:11px;
    color:#6b7280;
    margin-bottom:3px;
}

.detail-value{
    font-size:14px;
    font-weight:bold;
    word-break:break-word;
}

.amount{
    color:#15803d;
}

/* ================= DELETE BUTTON ================= */

.delete-btn{
    width:100%;
    border:none;
    background:#dc2626;
    color:white;
    padding:12px;
    border-radius:10px;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

.delete-btn:hover{
    background:#b91c1c;
}

.delete-btn:disabled{
    background:#9ca3af;
    cursor:not-allowed;
}

/* ================= LOADING ================= */

.loading{
    text-align:center;
    padding:25px;
    color:#6b7280;
}

/* ================= MOBILE ================= */

@media(max-width:600px){

    .filter-row{
        grid-template-columns:1fr;
    }

    .summary{
        grid-template-columns:1fr 1fr 1fr;
    }

    .summary-card{
        padding:10px 5px;
    }

    .summary-number{
        font-size:18px;
    }

    .details{
        grid-template-columns:1fr 1fr;
    }

}

</style>

</head>


<body>

<div class="header">
    🗑️ Admin Wining Delete
</div>


<div class="container">


    <!-- ================= FILTER ================= -->

    <div class="filter-box">

        <div class="filter-title">
            Date aur Market Select Karein
        </div>

        <div class="filter-row">

            <select
                id="dateSelect"
                class="select-box"
                onchange="dateChanged()">

                <option value="">
                    Select Date
                </option>

            </select>


            <select
                id="marketSelect"
                class="select-box"
                onchange="marketChanged()"
                disabled>

                <option value="">
                    Select Market
                </option>

            </select>

        </div>


        <div class="warning">

            ⚠️ <b>Dhyan se:</b>
            Pehle Date aur Market dono select karein.
            Sirf selected Date + Market ki Wining rows hi neeche dikhengi.
            Delete karne se pehle confirmation bhi aayega.

        </div>

    </div>


    <!-- ================= SUMMARY ================= -->

    <div
        id="summary"
        class="summary"
        style="display:none;">

        <div class="summary-card">

            <div
                id="totalRows"
                class="summary-number">
                0
            </div>

            <div class="summary-label">
                Total Rows
            </div>

        </div>


        <div class="summary-card">

            <div
                id="pendingRows"
                class="summary-number">
                0
            </div>

            <div class="summary-label">
                Pending
            </div>

        </div>


        <div class="summary-card">

            <div
                id="totalWinning"
                class="summary-number">
                ₹0
            </div>

            <div class="summary-label">
                Total Winning
            </div>

        </div>

    </div>


    <!-- ================= CONTENT ================= -->

    <div id="content">

        <div class="empty">

            📅 Pehle Date select karein

        </div>

    </div>


</div>


<script>

/* =========================================================
   SUPABASE
========================================================= */

const supabaseClient =
    supabase.createClient(

        "https://glhomrlwnwhevunfubog.supabase.co",

        "sb_publishable_VihOz3hSXZzUiI9eANDL0A_EtaD-KIB"

    );


/* =========================================================
   GLOBAL DATA
========================================================= */

let allWining = [];

let allHistory = [];

let selectedDate = "";

let selectedMarket = "";


/* =========================================================
   PAGE LOAD
========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    async function(){

        await loadWiningData();

    }
);


/* =========================================================
   LOAD WINING DATA
========================================================= */

async function loadWiningData(){

    showLoading();

    try{

        /*
         * Pehle wining table ka data
         */

        const {
            data: winingData,
            error: winingError
        } = await supabaseClient
            .from("wining")
            .select("*")
            .order("id", {
                ascending:false
            });


        if(winingError){

            throw winingError;

        }


        allWining = winingData || [];


        /*
         * Wining ke history_id nikaal rahe hain
         */

        const historyIds =
            [
                ...new Set(

                    allWining

                        .map(row => row.history_id)

                        .filter(
                            id =>
                            id !== null &&
                            id !== undefined
                        )

                )
            ];


        allHistory = [];


        /*
         * Agar history_id hain
         * to unki history load karo
         */

        if(historyIds.length > 0){

            const {
                data: historyData,
                error: historyError
            } = await supabaseClient
                .from("history")
                .select(
                    "id,market,typing,created_at"
                )
                .in(
                    "id",
                    historyIds
                );


            if(historyError){

                throw historyError;

            }


            allHistory =
                historyData || [];

        }


        /*
         * Date dropdown actual
         * wining rows se banao
         */

        populateDates();


        /*
         * Initial screen
         */

        showInitialMessage();

    }

    catch(error){

        console.error(error);

        document.getElementById(
            "content"
        ).innerHTML = `

            <div class="empty">

                ❌ Data load nahi ho saka

                <br><br>

                ${escapeHtml(error.message)}

            </div>

        `;

    }

}


/* =========================================================
   FIND HISTORY
========================================================= */

function getHistory(historyId){

    return allHistory.find(
        h =>
        String(h.id) ===
        String(historyId)
    );

}


/* =========================================================
   GET DATE
========================================================= */

function getWiningDate(row){

    const history =
        getHistory(row.history_id);


    /*
     * Sabse pehle history.typing
     */

    if(
        history &&
        history.typing
    ){

        const date =
            String(history.typing)
            .slice(0,10);

        if(
            /^\d{4}-\d{2}-\d{2}$/.test(date)
        ){

            return date;

        }

    }


    /*
     * Agar typing date nahi hai
     * to history.created_at
     */

    if(
        history &&
        history.created_at
    ){

        return getLocalDate(
            history.created_at
        );

    }


    /*
     * Last fallback:
     * wining.created_at
     */

    if(row.created_at){

        return getLocalDate(
            row.created_at
        );

    }


    return "";

}


/* =========================================================
   GET MARKET
========================================================= */

function getWiningMarket(row){

    /*
     * Pehle wining.market
     */

    if(
        row.market &&
        String(row.market).trim()
    ){

        return String(row.market).trim();

    }


    /*
     * Warna history.market
     */

    const history =
        getHistory(row.history_id);


    if(
        history &&
        history.market
    ){

        return String(
            history.market
        ).trim();

    }


    return "";

}


/* =========================================================
   POPULATE DATES
========================================================= */

function populateDates(){

    const dateSet =
        new Set();


    allWining.forEach(row => {

        const date =
            getWiningDate(row);


        if(date){

            dateSet.add(date);

        }

    });


    const dates =
        [...dateSet].sort().reverse();


    const select =
        document.getElementById(
            "dateSelect"
        );


    select.innerHTML =
        `<option value="">
            Select Date
        </option>`;


    dates.forEach(date => {

        const option =
            document.createElement(
                "option"
            );


        option.value =
            date;


        option.textContent =
            formatDate(date);


        select.appendChild(
            option
        );

    });

}


/* =========================================================
   DATE CHANGED
========================================================= */

function dateChanged(){

    selectedDate =
        document.getElementById(
            "dateSelect"
        ).value;


    /*
     * Market reset
     */

    selectedMarket = "";


    const marketSelect =
        document.getElementById(
            "marketSelect"
        );


    marketSelect.innerHTML =
        `<option value="">
            Select Market
        </option>`;


    marketSelect.disabled =
        true;


    hideSummary();


    /*
     * Date nahi hai
     */

    if(!selectedDate){

        showInitialMessage();

        return;

    }


    /*
     * Selected date ke markets
     */

    const marketSet =
        new Set();


    allWining.forEach(row => {

        const date =
            getWiningDate(row);


        if(date !== selectedDate){

            return;

        }


        const market =
            getWiningMarket(row);


        if(market){

            marketSet.add(market);

        }

    });


    const markets =
        [...marketSet].sort(
            (a,b) =>
            a.localeCompare(
                b
            )
        );


    markets.forEach(market => {

        const option =
            document.createElement(
                "option"
            );


        option.value =
            market;


        option.textContent =
            market;


        marketSelect.appendChild(
            option
        );

    });


    if(markets.length > 0){

        marketSelect.disabled =
            false;


        document.getElementById(
            "content"
        ).innerHTML = `

            <div class="empty">

                🏪 Ab Market select karein

            </div>

        `;

    }

    else{

        document.getElementById(
            "content"
        ).innerHTML = `

            <div class="empty">

                Is Date ki koi Wining nahi mili.

            </div>

        `;

    }

}


/* =========================================================
   MARKET CHANGED
========================================================= */

function marketChanged(){

    selectedMarket =
        document.getElementById(
            "marketSelect"
        ).value;


    hideSummary();


    /*
     * Date + Market dono mandatory
     */

    if(
        !selectedDate ||
        !selectedMarket
    ){

        showInitialMessage();

        return;

    }


    renderWining();

}


/* =========================================================
   RENDER WINING
========================================================= */

function renderWining(){

    /*
     * Extra safety:
     * Date aur Market dono hone chahiye
     */

    if(
        !selectedDate ||
        !selectedMarket
    ){

        showInitialMessage();

        return;

    }


    const rows =
        allWining.filter(row => {

            const rowDate =
                getWiningDate(row);


            const rowMarket =
                getWiningMarket(row);


            return (
                rowDate === selectedDate &&
                rowMarket.toLowerCase() ===
                selectedMarket.toLowerCase()
            );

        });


    /*
     * Summary
     */

    updateSummary(rows);


    /*
     * No rows
     */

    if(rows.length === 0){

        document.getElementById(
            "content"
        ).innerHTML = `

            <div class="empty">

                Is Date aur Market ki
                koi Wining row nahi mili.

            </div>

        `;

        return;

    }


    /*
     * Pending pehle
     */

    rows.sort((a,b) => {

        if(
            a.status === "pending" &&
            b.status !== "pending"
        ){

            return -1;

        }


        if(
            a.status !== "pending" &&
            b.status === "pending"
        ){

            return 1;

        }


        return Number(b.id) -
               Number(a.id);

    });


    let html =
        `<div class="wining-list">`;


    rows.forEach(row => {

        html += createWiningCard(
            row
        );

    });


    html +=
        `</div>`;


    document.getElementById(
        "content"
    ).innerHTML =
        html;

}


/* =========================================================
   CREATE CARD
========================================================= */

function createWiningCard(row){

    const status =
        String(
            row.status ||
            "pending"
        ).toLowerCase();


    let statusClass =
        "status-pending";


    let statusText =
        "PENDING";


    if(status === "accepted"){

        statusClass =
            "status-accepted";

        statusText =
            "ACCEPT";

    }


    if(
        status === "cancelled" ||
        status === "canceled"
    ){

        statusClass =
            "status-cancelled";

        statusText =
            "CANCEL";

    }


    return `

        <div class="wining-card">

            <div class="card-top">

                <div class="number">

                    ${escapeHtml(
                        row.number || "-"
                    )}

                </div>


                <div
                    class="status ${statusClass}">

                    ${statusText}

                </div>

            </div>


            <div class="details">

                <div class="detail">

                    <div class="detail-label">
                        Wining ID
                    </div>

                    <div class="detail-value">
                        ${escapeHtml(
                            row.id
                        )}
                    </div>

                </div>


                <div class="detail">

                    <div class="detail-label">
                        User ID
                    </div>

                    <div class="detail-value">
                        ${escapeHtml(
                            row.user_id || "-"
                        )}
                    </div>

                </div>


                <div class="detail">

                    <div class="detail-label">
                        History ID
                    </div>

                    <div class="detail-value">
                        ${escapeHtml(
                            row.history_id || "-"
                        )}
                    </div>

                </div>


                <div class="detail">

                    <div class="detail-label">
                        Bet Amount
                    </div>

                    <div class="detail-value">
                        ₹${escapeHtml(
                            row.bet_amount || 0
                        )}
                    </div>

                </div>


                <div class="detail">

                    <div class="detail-label">
                        Game Type
                    </div>

                    <div class="detail-value">
                        ${escapeHtml(
                            row.game_type || "-"
                        )}
                    </div>

                </div>


                <div class="detail">

                    <div class="detail-label">
                        Winning
                    </div>

                    <div class="detail-value amount">
                        ₹${escapeHtml(
                            row.amount || 0
                        )}
                    </div>

                </div>

            </div>


            <button
                class="delete-btn"
                onclick="deleteWining(${row.id})">

                🗑️ DELETE THIS WINING

            </button>

        </div>

    `;

}


/* =========================================================
   DELETE WINING
========================================================= */

async function deleteWining(id){

    /*
     * Date mandatory
     */

    if(!selectedDate){

        alert(
            "Pehle Date select karein."
        );

        return;

    }


    /*
     * Market mandatory
     */

    if(!selectedMarket){

        alert(
            "Pehle Market select karein."
        );

        return;

    }


    /*
     * Selected row find karo
     */

    const row =
        allWining.find(
            item =>
            String(item.id) ===
            String(id)
        );


    if(!row){

        alert(
            "Wining row nahi mili."
        );

        return;

    }


    /*
     * DELETE se pehle
     * Date + Market dobara verify
     */

    const rowDate =
        getWiningDate(row);


    const rowMarket =
        getWiningMarket(row);


    if(rowDate !== selectedDate){

        alert(
            "Date mismatch hai. Row delete nahi ki gayi."
        );

        return;

    }


    if(
        rowMarket.toLowerCase() !==
        selectedMarket.toLowerCase()
    ){

        alert(
            "Market mismatch hai. Row delete nahi ki gayi."
        );

        return;

    }


    /*
     * Final confirmation
     */

    const confirmDelete =
        confirm(

            "⚠️ CONFIRM DELETE\n\n" +

            "Date: " +
            formatDate(
                selectedDate
            ) +

            "\nMarket: " +
            selectedMarket +

            "\nNumber: " +
            (row.number || "-") +

            "\nUser ID: " +
            (row.user_id || "-") +

            "\nWinning: ₹" +
            (row.amount || 0) +

            "\n\nKya aap is Wining row ko DELETE karna chahte hain?"

        );


    if(!confirmDelete){

        return;

    }


    /*
     * Delete only wining table row
     */

    const {
        error
    } = await supabaseClient
        .from("wining")
        .delete()
        .eq("id", id);


    if(error){

        console.error(error);


        alert(
            "Delete nahi hua:\n\n" +
            error.message
        );


        return;

    }


    alert(
        "Wining row successfully delete ho gayi."
    );


    /*
     * Fresh data load
     */

    await loadWiningData();


    /*
     * Date ko dobara set karo
     */

    const dateSelect =
        document.getElementById(
            "dateSelect"
        );


    dateSelect.value =
        selectedDate;


    /*
     * Markets dobara create
     */

    dateChanged();


    /*
     * Market ko dobara select karo
     */

    const marketSelect =
        document.getElementById(
            "marketSelect"
        );


    marketSelect.value =
        selectedMarket;


    /*
     * Render
     */

    marketChanged();

}


/* =========================================================
   SUMMARY
========================================================= */

function updateSummary(rows){

    document.getElementById(
        "summary"
    ).style.display =
        "grid";


    const total =
        rows.length;


    const pending =
        rows.filter(
            row =>
            String(
                row.status ||
                "pending"
            ).toLowerCase() ===
            "pending"
        ).length;


    const totalWinning =
        rows.reduce(
            (sum,row) =>
            sum +
            Number(
                row.amount || 0
            ),
            0
        );


    document.getElementById(
        "totalRows"
    ).textContent =
        total;


    document.getElementById(
        "pendingRows"
    ).textContent =
        pending;


    document.getElementById(
        "totalWinning"
    ).textContent =
        "₹" +
        totalWinning;

}


/* =========================================================
   HIDE SUMMARY
========================================================= */

function hideSummary(){

    document.getElementById(
        "summary"
    ).style.display =
        "none";

}


/* =========================================================
   INITIAL MESSAGE
========================================================= */

function showInitialMessage(){

    hideSummary();


    document.getElementById(
        "content"
    ).innerHTML = `

        <div class="empty">

            📅 Pehle Date select karein

            <br><br>

            Phir Market select karein.
            <br>
            Uske baad hi Wining rows dikhengi.

        </div>

    `;

}


/* =========================================================
   LOADING
========================================================= */

function showLoading(){

    document.getElementById(
        "content"
    ).innerHTML = `

        <div class="loading">

            ⏳ Wining data load ho raha hai...

        </div>

    `;

}


/* =========================================================
   DATE FORMAT
========================================================= */

function formatDate(date){

    if(!date){

        return "";

    }


    const parts =
        String(date).split("-");


    if(parts.length !== 3){

        return date;

    }


    return (
        parts[2] +
        "-" +
        parts[1] +
        "-" +
        parts[0]
    );

}


/* =========================================================
   LOCAL DATE
========================================================= */

function getLocalDate(value){

    if(!value){

        return "";

    }


    const date =
        new Date(value);


    if(
        isNaN(
            date.getTime()
        )
    ){

        return "";

    }


    const year =
        date.getFullYear();


    const month =
        String(
            date.getMonth() + 1
        ).padStart(
            2,
            "0"
        );


    const day =
        String(
            date.getDate()
        ).padStart(
            2,
            "0"
        );


    return (
        year +
        "-" +
        month +
        "-" +
        day
    );

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value){

    if(
        value === null ||
        value === undefined
    ){

        return "";

    }


    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}

</script>

</body>

</html>
