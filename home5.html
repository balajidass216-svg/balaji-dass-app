<script>

/* =========================
   USER
========================= */

const user =
  JSON.parse(
    localStorage.getItem("user")
  );


if(!user){

  window.location.href =
    "index.html";

}


/* =========================
   SUPABASE
========================= */

const client =
  supabase.createClient(

    "https://glhomrlwnwhevunfubog.supabase.co",

    "sb_publishable_VihOz3hSXZzUiI9eANDL0A_EtaD-KIB"

  );


/* =========================
   WALLET
========================= */

async function loadWallet(){

  try{

    const {
      data,
      error
    } = await client

      .from("login")

      .select("balance")

      .eq("id", user.id)

      .single();


    if(error){

      console.log(
        "WALLET ERROR:",
        error
      );

      return;

    }


    document
      .getElementById("userId")
      .innerText =
      "ID: " + user.id;


    if(data){

      document
        .getElementById("wallet")
        .innerText =
        "💰 ₹" +
        Number(data.balance || 0);

    }

  }

  catch(error){

    console.log(error);

  }

}


/* =========================
   GAME STATUS
========================= */

function checkStatus(
  openTime,
  closeTime
){

  if(
    !openTime ||
    !closeTime
  ){

    return false;

  }


  let now =
    new Date();


  const [oh,om] =
    openTime.split(":");


  const [ch,cm] =
    closeTime.split(":");


  let open =
    new Date();


  open.setHours(
    Number(oh),
    Number(om),
    0,
    0
  );


  let close =
    new Date();


  close.setHours(
    Number(ch),
    Number(cm),
    0,
    0
  );


  if(close < open){

    close.setDate(
      close.getDate() + 1
    );


    if(now < open){

      now.setDate(
        now.getDate() + 1
      );

    }

  }


  return (
    now >= open &&
    now <= close
  );

}


/* =========================
   LOAD GAMES
========================= */

async function loadButtons(){

  const container =
    document.getElementById(
      "container"
    );


  container.innerHTML = `

    <div class="noData">
      Loading games...
    </div>

  `;


  try{

    const {
      data,
      error
    } = await client

      .from("Game result")

      .select(
        "name, number, open, close"
      );


    if(error){

      console.log(
        "GAME ERROR:",
        error
      );


      container.innerHTML = `

        <div class="noData">
          Game data load nahi hua
        </div>

      `;

      return;

    }


    if(
      !data ||
      data.length === 0
    ){

      container.innerHTML = `

        <div class="noData">
          No games found
        </div>

      `;

      return;

    }

/* =========================
   SORT
========================= */

data.sort((a, b) => {

  const aOpen = checkStatus(a.open, a.close);
  const bOpen = checkStatus(b.open, b.close);

  if (aOpen && !bOpen) return -1;

  if (!aOpen && bOpen) return 1;

  return 0;

});


container.innerHTML = "";


/* =========================
   CREATE CARDS
========================= */

data.forEach(item=>{


      const isOpen =
        checkStatus(
          item.open,
          item.close
        );


      const btn =
        document.createElement(
          "div"
        );


      btn.className =
        "btn";


      btn.innerHTML = `

        <div class="gameTop">

          <div class="gameTimeLabel">

            OPEN:

            <span>
              ${item.open || "--"}
            </span>

          </div>


          <div class="gameTimeLabel">

            CLOSE:

            <span>
              ${item.close || "--"}
            </span>

          </div>

        </div>



        <div class="gameName">

          ${item.name || "Game"}

          ${isOpen ? " 🔥" : ""}

        </div>



        <div class="gameNumberRow">


          <div class="numberBox">

  <div class="gameNumber">

    ${getKalResult(item.name)}

  </div>

  <div class="numberLabel">

    कल

  </div>



          </div>



          <div class="arrow">

            ›

          </div>



          <div class="numberBox">

            <div class="gameNumber">

            ${item.number || "XX"}

            </div>

            <div class="numberLabel">

              आज

            </div>

          </div>


        </div>



        <div class="statusBox">

          ${
            isOpen
            ? "खेलें"
            : "बंद"
          }

        </div>

      `;


      /* =========================
         OPEN GAME
      ========================= */

      if(isOpen){

        btn.onclick =
          ()=>{

            localStorage.setItem(
              "market",
              item.name
            );


            window.location.href =
              "game.html";

          };

      }

      else{

        btn.style.opacity =
          "0.70";

      }


      container.appendChild(
        btn
      );

    });

  }

  catch(error){

    console.log(error);


    container.innerHTML = `

      <div class="noData">
        Something went wrong
      </div>

    `;

  }

}


/* =========================
   NAVIGATION
========================= */

  window.location.href =

/* =========================
   SHARE
========================= */

  if(
    navigator.share
  ){

    navigator.share({

      text:"Join now",

      url:
        window.location.href

    });

  }

}


/* =========================
   WALLET PAGE
========================= */

}


/* =========================
   LOGOUT
========================= */

function logout(){

  localStorage.removeItem(
    "user"
  );


  window.location.href =
    "index.html";

}


/* =========================
   START
========================= */

loadWallet();

loadButtons();


/* =========================
   AUTO REFRESH
========================= */

setInterval(
  ()=>{

    loadButtons();

    loadWallet();

  },
  60000
);
function getKalResult(marketName) {
  const results = JSON.parse(
    localStorage.getItem("yesterdayResults") || "{}"
  );

  return results[marketName] || "**";
}
      console.log(

);
