<script>

/* =====================================================
   SUPABASE
===================================================== */

const client =
  supabase.createClient(

    "https://glhomrlwnwhevunfubog.supabase.co",

  );


/* =====================================================
   USER
===================================================== */

const user =

    localStorage.getItem("user")
  );


if(!user){

/* =====================================================
   WALLET
===================================================== */

async function loadWallet(){

  if(!user) return;


  const {
    data,
    error
  } = await client

    .from("login")

    .select("balance")

    .eq("id",user.id)

    .single();

    console.log(
      "Wallet error:",

    );

  }


  document.getElementById(
    "walletBalance"
  ).innerText =
    Number(
      data?.balance || 0
    ).toFixed(2);

}


/* =====================================================
   TIME FORMAT
===================================================== */

function formatTimeAMPM(time){

  if(!time) return "--";


  const parts =
    String(time).split(":");


  let hour =
    Number(parts[0] || 0);


  const minute =
    Number(parts[1] || 0);


  const ampm =
    hour >= 12
      ? "PM"
      : "AM";


  hour =
    hour % 12 || 12;


  return (

    String(hour).padStart(2,"0")

    + ":" +

    String(minute).padStart(2,"0")

    + " " +

    ampm

  );

}


/* =====================================================
   GAME DAY
===================================================== */

function getGameDay(){

  const now =
    new Date();


  if(
    now.getHours() < 7
  ){

    now.setDate(
      now.getDate() - 1
    );

  }


  const year =
    now.getFullYear();


  const month =
    String(
      now.getMonth() + 1
    ).padStart(2,"0");


  const day =
    String(
      now.getDate()
    ).padStart(2,"0");


  return (

    year +
    "-" +
    month +
    "-" +
    day

  );

}


/* =====================================================
   LOCAL STORAGE KEY
===================================================== */

function getLocalResultKey(
  marketName
){

  return (
    "kalResult_" +
    marketName
  );

}


/* =====================================================
   SAVE TODAY RESULT AS KAL
===================================================== */

function saveTodayAsKal(
  marketName,
  todayNumber
){

  if(!marketName) return;


  if(
    !todayNumber ||
    todayNumber === "**"
  ){

    return;

  }


  const key =
    getLocalResultKey(
      marketName
    );


  const gameDay =
    getGameDay();


  const savedData = {

    result:
      todayNumber,

    gameDay:
      gameDay

  };


  localStorage.setItem(

    key,

    JSON.stringify(
      savedData
    )

  );

}


/* =====================================================
   GET KAL RESULT
===================================================== */

function getKalResult(
  marketName
){

  if(!marketName){

    return "**";

  }


  const key =
    getLocalResultKey(
      marketName
    );


  const saved =
    localStorage.getItem(
      key
    );


  if(!saved){

    return "**";

  }


  try{

    const data =
      JSON.parse(
        saved
      );


    return (
      data.result ||
      "**"
    );

  }

  catch(error){

    return "**";

  }

}


/* =====================================================
   PREPARE TODAY / KAL
===================================================== */

function prepareLocalResults(
  games
){

  if(!games ||
     !games.length){

    return;

  }


  const currentGameDay =
    getGameDay();


  games.forEach(

    item => {

      if(!item.name){

        return;

      }


      const todayNumber =
        item.number;


      if(
        todayNumber &&
        todayNumber !== "**"
      ){

        const key =
          getLocalResultKey(
            item.name
          );


        const old =
          localStorage.getItem(
            key
          );


        if(old){

          try{

            const oldData =
              JSON.parse(old);


            if(
              oldData.gameDay !==
              currentGameDay
            ){

              saveTodayAsKal(

                item.name,

                item.number

              );

            }

          }

          catch(e){

            saveTodayAsKal(

              item.name,

              item.number

            );

          }

        }

        else{

          saveTodayAsKal(

            item.name,

            item.number

          );

        }

      }

    }

  );

}


/* =====================================================
   CLOSE DATE
===================================================== */

function getCloseDate(
  closeTime
){

  if(!closeTime){

    return null;

  }


  const parts =
    String(closeTime)
      .split(":");


  let hour =
    Number(parts[0] || 0);


  let minute =
    Number(parts[1] || 0);


  let second =
    Number(parts[2] || 0);


  const gameDay =
    getGameDay();


  const [
    year,
    month,
    day
  ] =
    gameDay
      .split("-")
      .map(Number);


  const close =
    new Date(

      year,

      month - 1,

      day,

      hour,

      minute,

      second,

      0

    );


  if(
    hour < 7
  ){

    close.setDate(
      close.getDate() + 1
    );

  }


  return close;

}


/* =====================================================
   REMAINING TIME
===================================================== */

function getRemainingTime(
  closeTime
){

  const close =
    getCloseDate(
      closeTime
    );


  if(!close){

    return {

      closed:true,

      text:"बंद",

      seconds:0

    };

  }


  const now =
    new Date();


  const diff =
    Math.floor(

      (
        close.getTime() -
        now.getTime()
      ) / 1000

    );


  if(diff <= 0){

    return {

      closed:true,

      text:"बंद",

      seconds:0

    };

  }


  let remaining =
    diff;


  const hours =
    Math.floor(
      remaining / 3600
    );


  remaining %=
    3600;


  const minutes =
    Math.floor(
      remaining / 60
    );


  const seconds =
    remaining % 60;


  const text =

    String(hours)
      .padStart(2,"0")

    + ":" +

    String(minutes)
      .padStart(2,"0")

    + ":" +

    String(seconds)
      .padStart(2,"0");


  return {

    closed:false,

    text:text,

    seconds:diff

  };

}


/* =====================================================
   LOAD GAMES
===================================================== */

async function loadButtons(){

  const gamesBox =
    document.getElementById(
      "games"
    );


  const {
    data,
    error
  } = await client

    .from("Game result")

   .select(
  "name, number, open, close, kal"
);


  if(error){

    console.log(
      "Game error:",
      error
    );


    gamesBox.innerHTML = `

      <div style="
        text-align:center;
        padding:20px;
        color:red;
      ">

        Games load नहीं हो पाई।

      </div>

    `;

    return;

  }


  if(
    !data ||
    !data.length
  ){

    gamesBox.innerHTML = `

      <div style="
        text-align:center;
        padding:20px;
        color:#777;
      ">

        कोई game उपलब्ध नहीं है।

      </div>

    `;

    return;

  }


  prepareLocalResults(
    data
  );


  const games =
    [...data];


  games.sort(

    (a,b) => {

      const aTime =
        getRemainingTime(
          a.close
        );


      const bTime =
        getRemainingTime(
          b.close
        );


      if(
        aTime.closed &&
        !bTime.closed
      ){

        return 1;

      }


      if(
        !aTime.closed &&
        bTime.closed
      ){

        return -1;

      }


      if(
        !aTime.closed &&
        !bTime.closed
      ){

        return (
          aTime.seconds -
          bTime.seconds
        );

      }


      return 0;

    }

  );


  gamesBox.innerHTML =
    "";


  games.forEach(

    item => {

      const timeInfo =
        getRemainingTime(
          item.close
        );


      const card =
        document.createElement(
          "div"
        );


      card.className =
        "game-card";


      card.setAttribute(
        "data-close",
        item.close || ""
      );


      if(
        timeInfo.closed
      ){

        card.style.opacity =
          "0.70";

      }


      const active =
        !timeInfo.closed;


      const todayResult =
        item.number ||
        "**";


     const kalResult =
  item.kal || "**";


      card.innerHTML = `

        <div class="game-top">

          <div class="game-name">

            ${active ? "🔥 " : ""}

            ${item.name || "--"}

          </div>


          <div class="game-time">

            OPEN:
            ${formatTimeAMPM(item.open)}

            &nbsp; | &nbsp;

            CLOSE:
            ${formatTimeAMPM(item.close)}

          </div>

        </div>


        <div class="game-middle">

          <div class="result-box">

            <div class="result-number">

              ${kalResult}

            </div>

            <div class="result-label">

              कल

            </div>

          </div>


          <div
            class="countdown ${
              timeInfo.closed
                ? "closed"
                : ""
            }">

            ${timeInfo.text}

          </div>


          <div class="result-box">

            <div class="result-number">

              ${todayResult}

            </div>

            <div class="result-label">

              आज

            </div>

          </div>

        </div>

      `;


      if(active){

        card.onclick = () => {

          localStorage.setItem(

            "market",

            item.name

          );


          window.location.href =
            "game.html";

        };

      }


      gamesBox.appendChild(
        card
      );

    }

  );

}


/* =====================================================
   COUNTDOWN UPDATE
===================================================== */

function updateCountdowns(){

  const cards =
    document.querySelectorAll(
      ".game-card"
    );


  let becameClosed =
    false;


  cards.forEach(

    card => {

      const closeTime =
        card.getAttribute(
          "data-close"
        );


      if(!closeTime){

        return;

      }


      const timeInfo =
        getRemainingTime(
          closeTime
        );


      const countdown =
        card.querySelector(
          ".countdown"
        );


      if(!countdown){

        return;

      }


      if(
        !timeInfo.closed
      ){

        countdown.innerText =
          timeInfo.text;


        countdown.classList.remove(
          "closed"
        );


        card.style.opacity =
          "1";

      }


      else{

        if(
          !countdown.classList.contains(
            "closed"
          )
        ){

          becameClosed =
            true;

        }


        countdown.innerText =
          "बंद";


        countdown.classList.add(
          "closed"
        );


        card.style.opacity =
          "0.70";


        card.onclick =
          null;

      }

    }

  );


  if(becameClosed){

    loadButtons();

  }


  const now =
    new Date();


  if(
    now.getHours() === 7 &&
    now.getMinutes() === 0 &&
    now.getSeconds() < 2
  ){

    loadButtons();

  }

}


/* =====================================================
   CHECK 7 AM GAME DAY
===================================================== */

let lastGameDay =
  getGameDay();


function checkGameDay(){

  const currentGameDay =
    getGameDay();


  if(
    currentGameDay !==
    lastGameDay
  ){

    lastGameDay =
      currentGameDay;


    loadButtons();

    loadWallet();

  }

}


/* =====================================================
   NAVIGATION
===================================================== */

function goHome(){

  window.location.href =
    "home.html";

}


function goDeposit(){

  window.location.href =
    "deposit.html";

}


function goWithdraw(){

  window.location.href =
    "withdraw.html";

}


function goHistory(){

  window.location.href =
    "userhistory.html";

}


function goProfile(){

  window.location.href =
    "profile.html";

}


/* =====================================================
   START
===================================================== */

loadWallet();

loadButtons();


setInterval(

  updateCountdowns,

  1000

);


setInterval(

  checkGameDay,

  1000

);


setInterval(

  () => {

    loadButtons();

    loadWallet();

  },

  60000

);

</script>
