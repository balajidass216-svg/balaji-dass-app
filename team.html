<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Team</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial;
      background: #f2f2f2;
    }

    .header {
      background: red;
      color: white;
      padding: 18px;
      text-align: center;
      font-size: 22px;
      font-weight: bold;
    }

    .container {
      padding: 15px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 18px;
      margin-bottom: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .title {
      font-size: 16px;
      color: #555;
      margin-bottom: 10px;
    }

    .refer-code {
      font-size: 24px;
      font-weight: bold;
      color: red;
      text-align: center;
      padding: 12px;
      background: #fff1f1;
      border-radius: 12px;
      letter-spacing: 1px;
    }

    .copy-btn {
      width: 100%;
      padding: 13px;
      margin-top: 12px;
      background: #2d8cff;
      color: white;
      border: none;
      border-radius: 25px;
      font-size: 16px;
      cursor: pointer;
    }

    .count {
      font-size: 30px;
      font-weight: bold;
      color: #222;
      text-align: center;
    }

    .member {
      background: #f8f8f8;
      padding: 14px;
      border-radius: 12px;
      margin-top: 10px;
    }

    .member-name {
      font-weight: bold;
      font-size: 17px;
    }

    .member-id {
      color: #777;
      margin-top: 5px;
      font-size: 14px;
    }

    .empty {
      text-align: center;
      color: #777;
      padding: 20px;
    }

    .error {
      color: red;
      text-align: center;
      padding: 15px;
    }
  </style>
</head>

<body>

<div class="header">
  My Team
</div>

<div class="container">

  <!-- MY REFER CODE -->
  <div class="card">

    <div class="title">
      My Refer Code
    </div>

    <div id="myReferCode" class="refer-code">
      Loading...
    </div>

    <button class="copy-btn" onclick="copyReferCode()">
      COPY REFER CODE
    </button>

  </div>


  <!-- TEAM COUNT -->
  <div class="card">

    <div class="title">
      My Team
    </div>

    <div id="teamCount" class="count">
      0
    </div>

  </div>


  <!-- TEAM MEMBERS -->
  <div class="card">

    <div class="title">
      Team Members
    </div>

    <div id="teamList">
      <div class="empty">
        Loading...
      </div>
    </div>

  </div>

</div>


<script>

// ======================================
// SUPABASE
// ======================================

const SUPABASE_URL =
"https://glhomrlwnwhevunfubog.supabase.co";

const SUPABASE_KEY =
"sb_publishable_VihOz3hSXZzUiI9eANDL0A_EtaD-KIB";

const client = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


// ======================================
// GET CURRENT USER ID
// ======================================

const userId =
localStorage.getItem("userId");


// ======================================
// VARIABLES
// ======================================

let myReferCode = "";


// ======================================
// LOAD USER
// ======================================

async function loadUser() {

  if (!userId) {

    alert("Please login first");

    window.location.href = "index.html";

    return;
  }


  const { data, error } = await client
    .from("login")
    .select("id, name, refer_code")
    .eq("id", userId)
    .single();


  if (error) {

    console.log(error);

    document.getElementById("myReferCode").innerText =
      "Error";

    return;
  }


  myReferCode = data.refer_code || "";

  document.getElementById("myReferCode").innerText =
    myReferCode || "Not Available";


  loadTeam();

}


// ======================================
// LOAD TEAM
// ======================================

async function loadTeam() {

  if (!myReferCode) {

    document.getElementById("teamCount").innerText = "0";

    document.getElementById("teamList").innerHTML =
      '<div class="empty">No team members yet</div>';

    return;
  }


  const { data, error } = await client
    .from("login")
    .select("id, name")
    .eq("ref_code", myReferCode)
    .order("id", { ascending: false });


  if (error) {

    console.log(error);

    document.getElementById("teamList").innerHTML =
      '<div class="error">Team load nahi ho rahi</div>';

    return;
  }


  document.getElementById("teamCount").innerText =
    data.length;


  if (data.length === 0) {

    document.getElementById("teamList").innerHTML =
      '<div class="empty">Abhi koi team member nahi hai</div>';

    return;
  }


  let html = "";


  data.forEach(function(member) {

    html += `
      <div class="member">

        <div class="member-name">
          ${escapeHtml(member.name || "User")}
        </div>

        <div class="member-id">
          User ID: ${member.id}
        </div>

      </div>
    `;

  });


  document.getElementById("teamList").innerHTML =
    html;

}


// ======================================
// COPY REFER CODE
// ======================================

function copyReferCode() {

  if (!myReferCode) {

    alert("Refer code available nahi hai");

    return;
  }


  navigator.clipboard.writeText(myReferCode)
    .then(function() {

      alert("Refer code copied ✅");

    })
    .catch(function() {

      alert("Copy nahi ho paya");

    });

}


// ======================================
// SECURITY
// ======================================

function escapeHtml(text) {

  const div = document.createElement("div");

  div.textContent = text;

  return div.innerHTML;
}


// ======================================
// START
// ======================================

loadUser();

</script>

</body>
</html>
